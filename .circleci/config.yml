# v8.1: Secure installer diagnostics and first-run readiness retry.
# Retains the read-only v8 Python / MQL5 PING STATUS test. No order placement.
version: 2.1
orbs:
  macos: circleci/macos@2.5.4

jobs:
  mac-mt5-gui-debug:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    working_directory: ~/project
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - run:
          name: Verify Apple Silicon, trading strategy tests, and private VNC setup
          command: |
            set -euo pipefail
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            test -n "${MAC_VNC_PASSWORD:-}" || { echo 'ERROR: Set MAC_VNC_PASSWORD in CircleCI Project Settings'; exit 1; }
            mkdir -p verification_reports
            python3 -m unittest discover -s tests -v
            python3 run.py
            python3 mac_verify.py --require-apple-silicon
            echo 'APPLE_SILICON_STRATEGY_TESTS=PASS'
      - run:
          name: Install and diagnose verified official MetaQuotes MT5 Mac package
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            stage="$(mktemp -d)"
            package_zip="$stage/MetaTrader5.pkg.zip"
            downloaded=no
            for url in \
              'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/MetaTrader5.pkg.zip' \
              'https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip'; do
              echo "TRYING_METATRADER_SOURCE=$url"
              if curl --fail --location --silent --show-error --retry 2 \
                  --connect-timeout 25 --max-time 360 \
                  --proto '=https' --proto-redir '=https' \
                  "$url" -o "$package_zip"; then
                if test -s "$package_zip" && unzip -tqq "$package_zip"; then
                  downloaded=yes
                  echo 'MT5_HTTPS_DOWNLOAD_AND_ZIP_VALIDATION=PASS'
                  break
                fi
                echo 'DOWNLOADED_FILE_NOT_VALID_ZIP; TRYING_NEXT_SOURCE'
              else
                echo 'DOWNLOAD_OR_TLS_VALIDATION_FAILED; TRYING_NEXT_SOURCE'
              fi
              rm -f "$package_zip"
            done
            if test "$downloaded" != yes; then
              echo 'ERROR: All MetaTrader HTTPS sources failed. Never disable TLS verification.'
              exit 1
            fi
            mkdir -p "$stage/unpacked"
            ditto -x -k "$package_zip" "$stage/unpacked"
            pkg="$(find "$stage/unpacked" -name '*.pkg' -print -quit)"
            test -n "$pkg" || { echo 'MT5_ERROR=PACKAGE_NOT_FOUND_IN_ZIP'; exit 1; }
            if ! pkgutil --check-signature "$pkg" > "$stage/package_signature.txt" 2>&1; then
              echo 'MT5_ERROR=PACKAGE_SIGNATURE_NOT_TRUSTED'
              exit 1
            fi
            if ! grep -Eiq 'MetaQuotes' "$stage/package_signature.txt"; then
              echo 'MT5_ERROR=PACKAGE_SIGNER_NOT_METAQUOTES'
              exit 1
            fi
            echo 'MT5_SIGNED_INSTALLER_VALIDATION=PASS'
            sudo installer -pkg "$pkg" -target /
            echo 'MT5_PKG_INSTALL_COMMAND=SUCCESS'
            app='/Applications/MetaTrader 5.app'
            wine="$app/Contents/SharedSupport/wine/bin/wine64"
            prefix="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
            terminal="$prefix/drive_c/Program Files/MetaTrader 5/terminal64.exe"
            editor="$prefix/drive_c/Program Files/MetaTrader 5/metaeditor64.exe"
            if test -d "$app"; then
              echo 'MT5_APP_BUNDLE_PRESENT=YES'
            else
              echo 'MT5_APP_BUNDLE_PRESENT=NO'
              echo 'MT5_ERROR=APP_BUNDLE_NOT_IN_EXPECTED_APPLICATIONS_LOCATION'
              exit 1
            fi
            # A successful .pkg installation need not mean the Wine prefix has
            # finished its first launch. Allow several attempts without bypassing
            # signature or HTTPS verification.
            ready=no
            for n in $(seq 1 15); do
              if test -x "$wine"; then echo 'MT5_WINE64_PRESENT=YES'; else echo 'MT5_WINE64_PRESENT=NO'; fi
              if test -s "$terminal"; then echo 'MT5_TERMINAL_EXE_PRESENT=YES'; else echo 'MT5_TERMINAL_EXE_PRESENT=NO'; fi
              if test -s "$editor"; then echo 'MT5_METAEDITOR_EXE_PRESENT=YES'; else echo 'MT5_METAEDITOR_EXE_PRESENT=NO'; fi
              if test -x "$wine" && test -s "$terminal" && test -s "$editor"; then
                ready=yes
                break
              fi
              echo "MT5_FIRST_RUN_ATTEMPT=$n"
              if ! open -a 'MetaTrader 5'; then
                echo 'MT5_LAUNCH_ATTEMPT_FAILED=YES'
              fi
              sleep 12
            done
            if test "$ready" != yes; then
              echo 'MT5_ERROR=FIRST_RUN_COMPONENTS_NOT_READY'
              if test -d "$app/Contents/SharedSupport"; then
                echo 'MT5_SHARED_SUPPORT_ENTRIES_BEGIN'
                find "$app/Contents/SharedSupport" -maxdepth 3 -mindepth 1 -type d -print | head -50 || true
                echo 'MT5_SHARED_SUPPORT_ENTRIES_END'
              fi
              if test -d "$prefix"; then
                echo 'MT5_PREFIX_EXISTS=YES'
                find "$prefix/drive_c" -maxdepth 6 \( -name terminal64.exe -o -name metaeditor64.exe \) -print 2>/dev/null | head -30 || true
              else
                echo 'MT5_PREFIX_EXISTS=NO'
              fi
              exit 1
            fi
            echo 'MT5_WINE_AND_TERMINAL_READY=YES'
            echo 'OFFICIAL_MAC_MT5_INSTALLED=YES'
      - macos/enable-vnc:
          username: vncuser
          password: MAC_VNC_PASSWORD
      - run:
          name: Auto-compile, install EA in active Wine data folders, and test PING STATUS
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            python3 .circleci/dualbot_mac_bootstrap_v8.py --prepare
            echo 'AUTO_BRIDGE_PREPARED=YES; DETAILS_IN_ARTIFACT'
      - run:
          name: Keep MT5 desktop available for Deriv.com Limited interactive demo login
          command: |
            set -euo pipefail
            open -a 'MetaTrader 5' || true
            echo 'MAC_DESKTOP_READY=YES; USE_RERUN_WITH_SSH_FOR_INTERACTIVE_ACCESS'
            echo 'AFTER_DEMO_LOGIN: python3 .circleci/dualbot_mac_bootstrap_v8.py --verify-only'
            echo 'NEVER SHARE ACCOUNT PASSWORDS OR ENABLE ALGO TRADING'
      - store_artifacts:
          path: verification_reports
          destination: mac-mt5-gui-readiness

workflows:
  interactive-mt5-broker-discovery:
    jobs:
      - mac-mt5-gui-debug
