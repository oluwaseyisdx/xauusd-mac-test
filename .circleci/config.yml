# CircleCI Apple Silicon M4 Pro / macOS 15 diagnostic.
# Designed for demo/read-only use ONLY. No order-submission code.
version: 2.1

jobs:
  mac-mt5-readonly:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    working_directory: ~/project
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - run:
          name: Check genuine Apple Silicon and existing Python strategy
          command: |
            set -euo pipefail
            mkdir -p verification_reports
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            uname -m
            sw_vers
            python3 -m unittest discover -s tests -v
            python3 run.py
            python3 mac_verify.py --require-apple-silicon
      - run:
          name: Install official MetaQuotes MT5 for macOS
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            stage="$(mktemp -d)"
            curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 \
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
              -o "$stage/MetaTrader5.pkg.zip"
            mkdir -p "$stage/unpacked"
            ditto -x -k "$stage/MetaTrader5.pkg.zip" "$stage/unpacked"
            pkg="$(find "$stage/unpacked" -name '*.pkg' -print -quit)"
            test -n "$pkg"
            sudo installer -pkg "$pkg" -target /
            open -a 'MetaTrader 5' || true
            sleep 20
            test -x '/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
            test -s "$HOME/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/terminal64.exe"
            echo 'OFFICIAL_MAC_MT5_INSTALLED=YES'
      - run:
          name: Compile and run read-only MQL5 to native Python bridge
          no_output_timeout: 10m
          command: |
            set -euo pipefail
            python3 .circleci/readonly_bridge_probe.py
      - store_artifacts:
          path: verification_reports
          destination: mac-mt5-readonly-reports

workflows:
  test-apple-silicon-mt5:
    jobs:
      - mac-mt5-readonly
