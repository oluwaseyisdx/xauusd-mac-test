# DualBot Stage 4 CircleCI fallback - READ ONLY / NO TRADES
# Use as .circleci/config.yml in the repo to run this diagnostic on CircleCI M4 Pro.
# This is a standalone replacement for the earlier interactive-v8.2 CircleCI workflow.
# IMPORTANT: save previous .circleci/config.yml from Git history; restoring the prior
# file restores the older VNC/bridge workflow when no longer needed.
# CircleCI secrets must be set under Project Settings -> Environment Variables:
# MT5_DEMO_LOGIN, MT5_DEMO_PASSWORD, MT5_DEMO_SERVER.
# Do NOT paste credentials into YAML or upload account logs.
# CircleCI credits: M4 Pro medium uses 200 credits/minute.
version: '2.1'
jobs:
  dualbot-stage4-deriv-isolation:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    working_directory: ~/project
    environment:
      PYTHONUNBUFFERED: '1'
      STAGE4_SYMBOL: Range Break 200 Index
    steps:
    - checkout
    - run:
        name: Initialize CircleCI temporary directory and diagnostic run identifier
        command: |
          set -euo pipefail
          mkdir -p "$HOME/dualbot-stage4-temp"
          printf '%s\n' 'export RUNNER_TEMP="$HOME/dualbot-stage4-temp"' >> "$BASH_ENV"
          printf '%s\n' 'export GITHUB_RUN_ID="$CIRCLE_WORKFLOW_ID"' >> "$BASH_ENV"
          echo "CIRCLECI_APPLE_SILICON_STAGE4=STARTED"
    - run:
        name: Confirm genuine Apple Silicon
        command: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          echo 'APPLE_SILICON_ARM64=CONFIRMED'
    - run:
        name: Check DEMO credentials are configured without displaying them
        command: |
          set -euo pipefail
          if test -z "${MT5_DEMO_LOGIN:-}" || test -z "${MT5_DEMO_PASSWORD:-}" || test -z "${MT5_DEMO_SERVER:-}"; then
            echo 'MISSING_CIRCLECI_DEMO_SECRETS: Set 3 environment variables in CircleCI Project Settings > Environment Variables'
            exit 1
          fi
          echo 'CIRCLECI_DEMO_SECRETS_PRESENT=YES; DEMO_AUTHENTICATION_NOT_YET_VERIFIED'
    - run:
        name: Check standard HTTPS connectivity independently of MT5 broker connection
        command: |
          python3 - \<<'PY'
          import json,socket
          result={}
          for hostname in ('deriv.com','www.metatrader5.com'):
              try:
                  with socket.create_connection((hostname,443),timeout=10):
                      result[hostname]='TCP_443_REACHABLE'
              except (OSError,TimeoutError):
                  result[hostname]='NOT_REACHABLE'
          print('NETWORK_HTTPS_CONTROL='+json.dumps(result,sort_keys=True))
          print('NOTE: HTTPS connectivity is not proof of an MT5 trade-server connection')
          PY
    - run:
        name: Install signed MetaQuotes MT5 for Apple Silicon
        command: |
          set -euo pipefail
          if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          cd "$RUNNER_TEMP"
          ok=no
          for url in \
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
            'https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip'; do
            if curl -fLsS --retry 2 --connect-timeout 25 --max-time 240 \
                --proto '=https' --proto-redir '=https' "$url" -o MetaTrader5.pkg.zip \
                && test -s MetaTrader5.pkg.zip && unzip -tqq MetaTrader5.pkg.zip; then
              ok=yes; break
            fi
          done
          test "$ok" = yes
          mkdir -p mt5_unpacked
          ditto -x -k MetaTrader5.pkg.zip mt5_unpacked
          pkg="$(find "$RUNNER_TEMP/mt5_unpacked" -name '*.pkg' -print -quit)"
          test -n "$pkg"
          pkgutil --check-signature "$pkg" > "$RUNNER_TEMP/signed_pkg_private.txt" 2>&1
          grep -Eiq 'MetaQuotes' "$RUNNER_TEMP/signed_pkg_private.txt"
          sudo installer -pkg "$pkg" -target / >/dev/null
          open -a 'MetaTrader 5' || true
          prefix="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
          ready=no
          for n in $(seq 1 24); do
            if test -s "$prefix/drive_c/Program Files/MetaTrader 5/terminal64.exe" \
               && test -s "$prefix/drive_c/Program Files/MetaTrader 5/metaeditor64.exe"; then
              ready=yes; break
            fi
            open -a 'MetaTrader 5' || true
            sleep 10
          done
          test "$ready" = yes
          echo 'MT5_SIGNED_INSTALL=PASS'
        no_output_timeout: 14m
    - run:
        name: Compile standalone non-trading Expert Advisor for broker-state heartbeat
        command: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/DualBotStage4.mq5" \<<'MQL_SOURCE'
          #property strict
          #property version "1.00"
          #property description "DualBot Stage 4 read-only broker state diagnostics. No orders."
          #define DB_RUN "__RUN_ID__"
          #define DB_SYMBOL "__TARGET_SYMBOL__"
          int sequence=0;
          bool IsDeriv()
          {
             string a=AccountInfoString(ACCOUNT_COMPANY);
             string b=AccountInfoString(ACCOUNT_SERVER);
             StringToLower(a); StringToLower(b);
             return (StringFind(a,"deriv")>=0 || StringFind(b,"deriv")>=0);
          }
          void Publish()
          {
             sequence++;
             bool connected=(bool)TerminalInfoInteger(TERMINAL_CONNECTED);
             bool hasaccount=(AccountInfoInteger(ACCOUNT_LOGIN)>0);
             bool demo=(AccountInfoInteger(ACCOUNT_TRADE_MODE)==ACCOUNT_TRADE_MODE_DEMO);
             bool deriv=IsDeriv();
             bool iscustom=false;
             bool exists=SymbolExist(DB_SYMBOL,iscustom);
             bool selected=false;
             int bars=0;
             bool recent=false;
             if(connected && demo && deriv && exists)
             {
                selected=SymbolSelect(DB_SYMBOL,true);
                if(selected)
                {
                   MqlTick t;
                   ZeroMemory(t);
                   recent=(SymbolInfoTick(DB_SYMBOL,t) && t.time>0 && t.bid>0 && t.ask>0 &&
                           MathAbs((long)TimeTradeServer()-(long)t.time)<=90);
                   MqlRates rates[];
                   int n=CopyRates(DB_SYMBOL,PERIOD_M15,1,420,rates);
                   bars=(n>0?n:0);
                }
             }
             int h=FileOpen("dualbot_stage4_state.csv",
                  FILE_WRITE|FILE_CSV|FILE_ANSI|FILE_COMMON|FILE_SHARE_READ|FILE_SHARE_WRITE,';');
             if(h==INVALID_HANDLE) return;
             // No account ID, server string, password, quote prices or candle history.
             FileWrite(h,DB_RUN,sequence,(int)connected,(int)hasaccount,
                (int)demo,(int)deriv,(int)exists,(int)selected,(int)recent,
                bars,SymbolsTotal(false),SymbolsTotal(true));
             FileClose(h);
          }
          int OnInit(){EventSetTimer(3);Publish();return INIT_SUCCEEDED;}
          void OnTimer(){Publish();}
          void OnDeinit(const int why){EventKillTimer();}
          MQL_SOURCE
          python3 - \<<'PY'
          import os,re,shutil,subprocess,time
          from pathlib import Path
          root=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
          app=Path('/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin')
          wine=next((p for p in (app/'wine64',app/'wine') if p.is_file()),None)
          assert wine is not None, 'WINE_LOADER_MISSING'
          src=root/'drive_c/DualBotStage4/DualBotStage4.mq5'
          src.parent.mkdir(parents=True,exist_ok=True)
          body=(Path(os.environ['RUNNER_TEMP'])/'DualBotStage4.mq5').read_text()
          sym=os.environ.get('STAGE4_SYMBOL','Range Break 200 Index')
          if sym not in ('Range Break 200 Index','Range Break 100 Index','Crash Boom Flip 500 Index'):
              raise SystemExit('UNEXPECTED_SYMBOL')
          body=body.replace('__RUN_ID__',os.environ['GITHUB_RUN_ID']).replace('__TARGET_SYMBOL__',sym)
          for token in ('OrderSend(', 'OrderCheck(', 'TRADE_ACTION_DEAL','CTrade','WebRequest(', 'SocketCreate('):
              assert token not in body
          src.write_text(body,encoding='ascii')
          binary=src.with_suffix('.ex5');log=src.with_suffix('.log')
          for f in (binary,log):f.unlink(missing_ok=True)
          env=os.environ.copy();env['WINEPREFIX']=str(root);env['WINEDEBUG']='-all'
          subprocess.run([str(wine),r'C:\Program Files\MetaTrader 5\metaeditor64.exe',
              r'/compile:C:\DualBotStage4\DualBotStage4.mq5','/log'],env=env,
              stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=120)
          for _ in range(12):
              if binary.exists() and log.exists():break
              time.sleep(1)
          blob=log.read_bytes() if log.exists() else b''
          msg=blob.decode('utf-16le' if blob.count(b'\x00')>len(blob)//8 else 'utf-8',errors='replace')
          if not (binary.is_file() and binary.stat().st_size>=500 and
                  re.search(r'Result:\s*0\s+errors?,\s*0\s+warnings?',msg,re.I)):
              raise SystemExit('MQL5_COMPILE_UNVERIFIED')
          dirs={root/'drive_c/Program Files/MetaTrader 5/MQL5/Experts'}
          for pat in ('drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/*/MQL5/Experts',
                      'drive_c/users/*/Application Data/MetaQuotes/Terminal/*/MQL5/Experts'):
              dirs.update(root.glob(pat))
          for target in dirs:
              target.mkdir(parents=True,exist_ok=True)
              shutil.copy2(binary,target/'DualBotStage4.ex5')
          print('STAGE4_READ_ONLY_EXPERT_COMPILED=YES')
          PY
        no_output_timeout: 14m
    - run:
        name: Separate server alias, login state, terminal journal and symbol availability
        command: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/check_stage4.py" \<<'STAGE4_PY'
          """Read-only, sanitize everything, distinguish MT5 terminal, EA, broker and symbol."""
          import csv,json,os,re,signal,socket,subprocess,time
          from pathlib import Path
          P=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
          ROOT=P/'drive_c/Program Files/MetaTrader 5'
          BINDIR=Path('/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin')
          WINE=next((p for p in (BINDIR/'wine64',BINDIR/'wine') if p.is_file()),None)
          LOGIN=os.environ.get('MT5_DEMO_LOGIN','').strip()
          PASSWORD=os.environ.get('MT5_DEMO_PASSWORD','')
          SERVER=os.environ.get('MT5_DEMO_SERVER','').strip()
          SYMBOL=os.environ.get('STAGE4_SYMBOL','Range Break 200 Index')
          RUN=os.environ['GITHUB_RUN_ID']
          RESULT=Path('dualbot_stage4_report.json')
          report={
             'test':'Stage4','platform':'macos-15-arm64','trades_sent':0,'demo_only':True,
             'symbol':SYMBOL,'secrets_configured':bool(LOGIN and PASSWORD and SERVER),
             'login_numeric':bool(LOGIN and LOGIN.isascii() and LOGIN.isdecimal()),
             'server_name_has_port':bool(re.search(r':\d{1,5}$',SERVER)),
             'server_name_looks_dns':bool('.' in SERVER and not SERVER.startswith('.')),
             'server_name_is_symbolic_alias':bool(SERVER and '.' not in SERVER and ':' not in SERVER),
             'control':{},'target_chart':{},'diagnosis':'NOT_STARTED',
             'authenticated_deriv_demo':False,'live_target_m15':False,
             'separate_ordinary_https_check_required':True,
          }
          def pids():
              try:
                  out=subprocess.check_output(['ps','-axo','pid=,command='],text=True,timeout=8)
              except (OSError,subprocess.SubprocessError):return []
              found=[]
              for line in out.splitlines():
                  try:pid,cmd=line.strip().split(None,1)
                  except ValueError:continue
                  low=cmd.lower()
                  if 'terminal64.exe' in low and ('wine' in low or 'metatrader' in low):
                      try:found.append(int(pid))
                      except ValueError:pass
              return list(dict.fromkeys(found))
          def stop():
              for pid in pids():
                  try:os.kill(pid,signal.SIGTERM)
                  except OSError:pass
              for _ in range(5):
                  if not pids():break
                  time.sleep(1)
              for pid in pids():
                  try:os.kill(pid,signal.SIGKILL)
                  except OSError:pass
              time.sleep(2)
          def paths():
              pats=(
                'drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/Common/Files/dualbot_stage4_state.csv',
                'drive_c/users/*/Application Data/MetaQuotes/Terminal/Common/Files/dualbot_stage4_state.csv',
                'drive_c/ProgramData/MetaQuotes/Terminal/Common/Files/dualbot_stage4_state.csv',
              )
              return list(set(p for pat in pats for p in P.glob(pat)))
          def snapshot(f):
              try:
                  stat=f.stat()
                  if stat.st_size>3072 or stat.st_size<1 or not (0<=time.time()-stat.st_mtime<=30):return None
                  rows=list(csv.reader(f.read_text(encoding='latin-1').splitlines(),delimiter=';'))
                  if not rows:return None
                  r=rows[-1]
                  if len(r)!=12 or r[0]!=RUN:return None
                  v=[int(x) for x in r[1:]]
                  return {'seq':v[0],'connected':bool(v[1]),'account_present':bool(v[2]),
                     'demo':bool(v[3]),'deriv':bool(v[4]),'symbol_exists':bool(v[5]),
                     'symbol_selected':bool(v[6]),'tick_recent':bool(v[7]),
                     'm15_completed_bars':max(0,v[8]),'symbols_all':max(0,v[9]),
                     'symbols_marketwatch':max(0,v[10])}
              except (OSError,ValueError,UnicodeError,csv.Error,OverflowError):return None
          def safe_journals(start):
              patterns=('drive_c/Program Files/MetaTrader 5/logs/*.log',
                'drive_c/Program Files/MetaTrader 5/MQL5/Logs/*.log',
                'drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/*/logs/*.log',
                'drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/*/MQL5/Logs/*.log',
                'drive_c/users/*/Application Data/MetaQuotes/Terminal/*/logs/*.log',
                'drive_c/users/*/Application Data/MetaQuotes/Terminal/*/MQL5/Logs/*.log')
              fs=list(set(f for pat in patterns for f in P.glob(pat) if f.is_file()))
              fs=[f for f in fs if f.stat().st_mtime>=start-8][:35]
              terms={
                 'auth_error':('authorization failed','invalid password','invalid account','login failed','account invalid'),
                 'server_unavailable':('no connection','connection failed','server not found','server unavailable','network failed'),
                 'version_error':('old version','obsolete version'),
                 'expert_error':('cannot load expert','failed to load expert','expert initialization failed'),
                 'symbol_error':('unknown symbol','invalid symbol','symbol not found'),
                 'broker_login_mentioned':('authorization on','authorized on','authorization successful','login on'),
              }
              flags={key:False for key in terms}
              flags['recent_journal_count']=len(fs)
              for f in fs:
                  try:
                      raw=f.read_bytes()[-120000:]
                      for encoding in ('utf-16le','utf-8'):
                          s=raw.decode(encoding,errors='replace').lower()
                          for key,phrases in terms.items():
                              flags[key] |= any(p in s for p in phrases)
                  except OSError:pass
              return flags
          def probe(chart,seconds):
              result={'chart_is_control':chart=='EURUSD','terminal_seen':False,
                      'ea_seen':False,'heartbeat_advanced':False,'status':{},'journal':{}}
              stop()
              for file in paths():
                  try:file.unlink()
                  except OSError:pass
              ini=P/'drive_c/dualbot_stage4_private.ini'
              # Secure, disposable config: only a demo MT5 account is ever permitted.
              if not LOGIN.isascii() or not LOGIN.isdecimal() or not LOGIN or not PASSWORD or not SERVER:
                  result['preflight']='INVALID_DEMO_FIELDS';return result
              if len(LOGIN)>20 or len(PASSWORD)>256 or len(SERVER)>160 or any(x in y for y in (LOGIN,PASSWORD,SERVER) for x in '\r\n\x00'):
                  result['preflight']='UNSAFE_DEMO_FIELDS';return result
              ini.write_text('[Common]\nLogin='+LOGIN+'\nPassword='+PASSWORD+'\nServer='+SERVER+
                  '\nKeepPrivate=0\nProxyEnable=0\n'
                  '[Experts]\nEnabled=1\nAllowLiveTrading=0\nAllowDllImport=0\n'
                  'Account=0\nProfile=0\n'
                  '[StartUp]\nExpert=DualBotStage4\nSymbol='+chart+'\nPeriod=M15\n',encoding='utf-8')
              ini.chmod(0o600)
              env=os.environ.copy()
              for key in ('MT5_DEMO_LOGIN','MT5_DEMO_PASSWORD','MT5_DEMO_SERVER'):env.pop(key,None)
              env['WINEPREFIX']=str(P)
              env['WINEDEBUG']='-all'
              start=time.time()
              try:
                  subprocess.Popen([str(WINE),r'C:\Program Files\MetaTrader 5\terminal64.exe',
                       r'/config:C:\dualbot_stage4_private.ini'],env=env,
                       stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
                  sequence=set()
                  cutoff=time.monotonic()+seconds
                  while time.monotonic()<cutoff:
                      result['terminal_seen'] |= bool(pids())
                      for f in paths():
                          row=snapshot(f)
                          if row:
                              result['ea_seen']=True
                              sequence.add(row['seq'])
                              result['heartbeat_advanced']=len(sequence)>=2
                              result['status']=row
                              if row['connected'] and row['demo'] and row['deriv'] and result['heartbeat_advanced']:
                                  # Still finish with journal flags for transparent diagnosis.
                                  break
                      if result.get('status',{}).get('connected') and result.get('status',{}).get('demo') and result['heartbeat_advanced']:
                          break
                      time.sleep(3)
                  result['journal']=safe_journals(start)
              finally:
                  ini.unlink(missing_ok=True)
                  stop()
              return result
          try:
              # Never print or upload secrets / terminal journals / account identifiers.
              if WINE is None or not (ROOT/'terminal64.exe').is_file():
                  report['diagnosis']='TERMINAL_OR_WINE_NOT_FOUND'
              elif not report['secrets_configured'] or not report['login_numeric']:
                  report['diagnosis']='DEMO_SECRETS_INVALID'
              else:
                  report['control']=probe('EURUSD',75)
                  report['target_chart']=probe(SYMBOL,75)
                  c=report['control'];t=report['target_chart']
                  s=t.get('status',{}) if t.get('ea_seen') else c.get('status',{})
                  auth=bool(s.get('connected') and s.get('account_present') and s.get('demo') and s.get('deriv'))
                  report['authenticated_deriv_demo']=auth
                  report['live_target_m15']=bool(auth and s.get('symbol_exists') and s.get('symbol_selected')
                     and s.get('tick_recent') and s.get('m15_completed_bars',0)>=399)
                  if not c.get('terminal_seen') and not t.get('terminal_seen'):
                      report['diagnosis']='TERMINAL_STARTUP_FAILED'
                  elif not c.get('ea_seen') and not t.get('ea_seen'):
                      report['diagnosis']='EA_AUTOSTART_OR_FILE_COMMON_FAILED'
                  elif not s.get('connected'):
                      report['diagnosis']='MT5_BROKER_NOT_CONNECTED'
                  elif not auth:
                      report['diagnosis']='NOT_AUTHENTICATED_ON_DERIV_DEMO'
                  elif not s.get('symbol_exists'):
                      report['diagnosis']='TARGET_SYMBOL_NOT_FOUND'
                  elif not s.get('symbol_selected'):
                      report['diagnosis']='TARGET_SYMBOL_NOT_SELECTED'
                  elif not s.get('tick_recent'):
                      report['diagnosis']='TARGET_TICK_NOT_FRESH'
                  elif s.get('m15_completed_bars',0)<399:
                      report['diagnosis']='NOT_ENOUGH_COMPLETED_M15_CANDLES'
                  else:
                      report['diagnosis']='LIVE_DERIV_DEMO_M15_READONLY_VERIFIED'
          except Exception as exc:
              # Never emit exception messages which could contain a private path/value.
              report['diagnosis']='DIAGNOSTIC_SCRIPT_EXCEPTION'
              report['exception_type']=type(exc).__name__
          finally:
              RESULT.write_text(json.dumps(report,sort_keys=True,indent=2)+'\n',encoding='utf-8')
              print('DUALBOT_STAGE4_SANITIZED='+json.dumps(report,sort_keys=True),flush=True)
          STAGE4_PY
          python3 "$RUNNER_TEMP/check_stage4.py"
        no_output_timeout: 14m
    - store_artifacts:
        path: dualbot_stage4_report.json
        destination: dualbot-stage4/connection-report
workflows:
  stage4-deriv-isolation:
    jobs:
    - dualbot-stage4-deriv-isolation
