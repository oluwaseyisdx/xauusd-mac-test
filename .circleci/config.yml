# v8.2: Support both Wine 10 (wine64) and Wine 11 (wine) loaders.
# Do not use real trading accounts; no automated trading functions.
version: 2.1
orbs:
  macos: circleci/macos@2.5.4

jobs:
  mac-mt5-gui-debug:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    working_directory: ~/project
    environment:
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout
      - run:
          name: Verify Apple Silicon, strategy tests, and private VNC setup
          command: |
            set -euo pipefail
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            test -n "${MAC_VNC_PASSWORD:-}" || { echo 'ERROR: MAC_VNC_PASSWORD is missing'; exit 1; }
            mkdir -p verification_reports
            python3 -m unittest discover -s tests -v
            python3 run.py
            python3 mac_verify.py --require-apple-silicon
            echo 'APPLE_SILICON_STRATEGY_TESTS=PASS'
      - run:
          name: Install MT5 and detect Wine 10 or Wine 11 loader
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            stage="$(mktemp -d)"
            package_zip="$stage/MetaTrader5.pkg.zip"
            downloaded=no
            for url in \
              'https://download.terminal.free/cdn/web/metaquotes.ltd/mt5/MetaTrader5.pkg.zip' \
              'https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip'; do
              echo "TRYING_METATRADER_SOURCE=$url"
              if curl --fail --location --silent --show-error --retry 2 \
                  --connect-timeout 25 --max-time 360 \
                  --proto '=https' --proto-redir '=https' \
                  "$url" -o "$package_zip"; then
                if test -s "$package_zip" && unzip -tqq "$package_zip"; then
                  downloaded=yes
                  echo 'MT5_HTTPS_DOWNLOAD_AND_ZIP_VALIDATION=PASS'
                  break
                fi
              fi
              rm -f "$package_zip"
            done
            test "$downloaded" = yes || { echo 'MT5_ERROR=ALL_HTTPS_DOWNLOADS_FAILED'; exit 1; }
            mkdir -p "$stage/unpacked"
            ditto -x -k "$package_zip" "$stage/unpacked"
            pkg="$(find "$stage/unpacked" -name '*.pkg' -print -quit)"
            test -n "$pkg" || { echo 'MT5_ERROR=PACKAGE_NOT_FOUND'; exit 1; }
            pkgutil --check-signature "$pkg" > "$stage/package_signature.txt" 2>&1 || { echo 'MT5_ERROR=PACKAGE_SIGNATURE_INVALID'; exit 1; }
            grep -Eiq 'MetaQuotes' "$stage/package_signature.txt" || { echo 'MT5_ERROR=PACKAGE_SIGNER_NOT_METAQUOTES'; exit 1; }
            echo 'MT5_SIGNED_INSTALLER_VALIDATION=PASS'
            sudo installer -pkg "$pkg" -target /
            echo 'MT5_PKG_INSTALL_COMMAND=SUCCESS'
            app='/Applications/MetaTrader 5.app'
            prefix="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
            terminal="$prefix/drive_c/Program Files/MetaTrader 5/terminal64.exe"
            editor="$prefix/drive_c/Program Files/MetaTrader 5/metaeditor64.exe"
            wine10="$app/Contents/SharedSupport/wine/bin/wine64"
            wine11="$app/Contents/SharedSupport/wine/bin/wine"
            test -d "$app" || { echo 'MT5_ERROR=APP_BUNDLE_MISSING'; exit 1; }
            ready=no
            for n in $(seq 1 15); do
              if test -x "$wine10"; then
                echo 'MT5_WINE_LOADER=wine64'
                ready_wine=yes
              elif test -x "$wine11"; then
                echo 'MT5_WINE_LOADER=wine'
                ready_wine=yes
              else
                echo 'MT5_WINE_LOADER=missing'
                ready_wine=no
              fi
              if test "$ready_wine" = yes && test -s "$terminal" && test -s "$editor"; then
                ready=yes
                break
              fi
              echo "MT5_FIRST_RUN_ATTEMPT=$n"
              open -a 'MetaTrader 5' || true
              sleep 12
            done
            if test "$ready" != yes; then
              echo 'MT5_ERROR=FIRST_RUN_COMPONENTS_NOT_READY'
              if test -d "$app/Contents/SharedSupport/wine/bin"; then
                echo 'MT5_WINE_BIN_FILES_BEGIN'
                ls -la "$app/Contents/SharedSupport/wine/bin" | head -60 || true
                echo 'MT5_WINE_BIN_FILES_END'
              fi
              if test -d "$prefix"; then
                echo 'MT5_PREFIX_EXISTS=YES'
                test -s "$terminal" && echo 'MT5_TERMINAL_EXE_PRESENT=YES' || echo 'MT5_TERMINAL_EXE_PRESENT=NO'
                test -s "$editor" && echo 'MT5_METAEDITOR_EXE_PRESENT=YES' || echo 'MT5_METAEDITOR_EXE_PRESENT=NO'
              fi
              exit 1
            fi
            echo 'MT5_WINE_AND_TERMINAL_READY=YES'
            echo 'OFFICIAL_MAC_MT5_INSTALLED=YES'
      - macos/enable-vnc:
          username: vncuser
          password: MAC_VNC_PASSWORD
      - run:
          name: Auto-compile, install EA and test read-only PING STATUS
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            app='/Applications/MetaTrader 5.app'
            wine64="$app/Contents/SharedSupport/wine/bin/wine64"
            wine="$app/Contents/SharedSupport/wine/bin/wine"
            if ! test -x "$wine64" && test -x "$wine"; then
              # Existing v8 bootstrap assumes the pre-Wine-11 loader name.
              # Patch the checked-out script in this temporary runner only.
              sed -i '' 's@/SharedSupport/wine/bin/wine64@/SharedSupport/wine/bin/wine@g' .circleci/dualbot_mac_bootstrap_v8.py
              echo 'BRIDGE_WINE11_COMPATIBILITY=ENABLED'
            fi
            python3 -m py_compile .circleci/dualbot_mac_bootstrap_v8.py
            python3 .circleci/dualbot_mac_bootstrap_v8.py --prepare
            echo 'AUTO_BRIDGE_PREPARED=YES; DETAILS_IN_ARTIFACT'
      - run:
          name: Keep MT5 desktop ready for interactive Deriv demo login
          command: |
            set -euo pipefail
            open -a 'MetaTrader 5' || true
            echo 'MAC_DESKTOP_READY=YES; USE_RERUN_WITH_SSH_FOR_INTERACTIVE_ACCESS'
            echo 'AFTER_LOGIN: python3 .circleci/dualbot_mac_bootstrap_v8.py --verify-only'
            echo 'KEEP_ALGO_TRADING_OFF; DO_NOT_SHARE_CREDENTIALS'
      - store_artifacts:
          path: verification_reports
          destination: mac-mt5-gui-readiness

workflows:
  interactive-mt5-broker-discovery:
    jobs:
      - mac-mt5-gui-debug
