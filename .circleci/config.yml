# DualBot Stage 7 — interactive read-only Deriv demo broker registration.
# Reuses proven official MetaQuotes PKG installer on CircleCI M4 Pro.
# Manual login using VNC through SSH; no MT5 credentials embedded in this file.
# Do not use any funded account. Algo Trading and order APIs remain disabled.
# For the operator: after the job completes, choose "Rerun job with SSH"
# in CircleCI, tunnel TCP 5900 and open a VNC client locally.
version: '2.1'
orbs:
  macos: circleci/macos@2.5.4
jobs:
  dualbot-stage7-interactive:
    macos:
      xcode: 16.4.0
    resource_class: m4pro.medium
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Check Apple Silicon and private VNC password
          command: |
            set -euo pipefail
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            test -n "${MAC_VNC_PASSWORD:-}" || { echo 'Set MAC_VNC_PASSWORD in CircleCI Project Settings > Environment Variables'; exit 2; }
            echo 'STAGE7_APPLE_SILICON=YES'
            echo 'STAGE7_NO_MT5_CREDENTIALS_REQUIRED=YES'
      - run:
          name: Install signed MetaQuotes MT5 for macOS (known working PKG)
          no_output_timeout: 14m
          command: |
            set -euo pipefail
            if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
              sudo softwareupdate --install-rosetta --agree-to-license
            fi
            stage="$HOME/dualbot-stage7"
            mkdir -p "$stage/unpacked"
            ok=no
            for url in \
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
              'https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip'; do
              if curl --fail --location --silent --show-error --retry 2 \
                  --connect-timeout 25 --max-time 300 --proto '=https' --proto-redir '=https' \
                  "$url" -o "$stage/MetaTrader5.pkg.zip" \
                  && test -s "$stage/MetaTrader5.pkg.zip" \
                  && unzip -tqq "$stage/MetaTrader5.pkg.zip"; then
                 ok=yes; break
              fi
            done
            test "$ok" = yes || { echo 'OFFICIAL_METAQUOTES_PKG_DOWNLOAD_FAILED'; exit 3; }
            ditto -x -k "$stage/MetaTrader5.pkg.zip" "$stage/unpacked"
            pkg="$(find "$stage/unpacked" -name '*.pkg' -print -quit)"
            test -n "$pkg" || exit 3
            pkgutil --check-signature "$pkg" > "$stage/private_pkg_signature.txt" 2>&1
            grep -Eiq 'MetaQuotes' "$stage/private_pkg_signature.txt"
            sudo installer -pkg "$pkg" -target / >/dev/null
            prefix="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
            open -a 'MetaTrader 5' || true
            ready=no
            for i in $(seq 1 24); do
              if test -s "$prefix/drive_c/Program Files/MetaTrader 5/terminal64.exe" \
                  && test -s "$prefix/drive_c/Program Files/MetaTrader 5/metaeditor64.exe"; then
                ready=yes; break
              fi
              open -a 'MetaTrader 5' || true
              sleep 8
            done
            test "$ready" = yes || { echo 'MT5_TERMINAL_OR_METAEDITOR_MISSING'; exit 3; }
            echo 'STAGE7_SIGNED_MT5_INSTALL=PASS'
      - macos/enable-vnc:
          username: vncuser
          password: MAC_VNC_PASSWORD
      - run:
          name: Compile safe Expert Advisor and launch MT5 for interactive registration
          no_output_timeout: 9m
          command: |
            set -euo pipefail
            mkdir -p "$HOME/dualbot-stage7"
            cat > "$HOME/dualbot-stage7/DualBotInteractive.mq5" \<<'STAGE7_MQL5'
            #property strict
            #property version "1.00"
            #property description "Stage 7 read-only Deriv demo verification; NO TRADES"
            #define RUN_ID "__RUN_ID__"
            #define TARGET_SYMBOL "Range Break 200 Index"
            int seq=0;
            bool IsDeriv()
            {
              string a=AccountInfoString(ACCOUNT_COMPANY);
              string b=AccountInfoString(ACCOUNT_SERVER);
              StringToLower(a); StringToLower(b);
              return StringFind(a,"deriv")>=0 || StringFind(b,"deriv")>=0;
            }
            void Publish()
            {
              seq++;
              bool connected=(bool)TerminalInfoInteger(TERMINAL_CONNECTED);
              bool acct=(AccountInfoInteger(ACCOUNT_LOGIN)>0);
              bool demo=(AccountInfoInteger(ACCOUNT_TRADE_MODE)==ACCOUNT_TRADE_MODE_DEMO);
              bool deriv=IsDeriv();
              bool custom=false;
              bool exists=SymbolExist(TARGET_SYMBOL,custom);
              bool selected=false, recent=false;
              int candles=0;
              if(connected && acct && demo && deriv && exists)
              {
                selected=SymbolSelect(TARGET_SYMBOL,true);
                if(selected)
                {
                  MqlTick tick; ZeroMemory(tick);
                  recent=SymbolInfoTick(TARGET_SYMBOL,tick) && tick.bid>0 && tick.ask>0
                      && tick.time>0 && MathAbs((long)TimeTradeServer()-(long)tick.time)<=90;
                  MqlRates rates[];
                  int n=CopyRates(TARGET_SYMBOL,PERIOD_M15,1,420,rates);
                  candles=n>0?n:0;
                }
              }
              int f=FileOpen("dualbot_stage7_status.csv",FILE_WRITE|FILE_CSV|FILE_ANSI|FILE_COMMON|FILE_SHARE_READ,';');
              if(f==INVALID_HANDLE) return;
              // Absolutely no login ID, password, server, quote price, or bar content exported.
              FileWrite(f,"S7",RUN_ID,seq,(int)connected,(int)acct,(int)demo,(int)deriv,
                    (int)exists,(int)selected,(int)recent,candles);
              FileClose(f);
            }
            int OnInit(){ EventSetTimer(3); Publish(); return INIT_SUCCEEDED; }
            void OnTimer(){ Publish(); }
            void OnDeinit(const int reason){ EventKillTimer(); }
            STAGE7_MQL5
            cat > "$HOME/dualbot-stage7/launch.py" \<<'STAGE7_PY'
            import csv,json,os,subprocess,time,shutil,signal
            from pathlib import Path
            BASE=Path.home()/'dualbot-stage7'
            P=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
            ROOT=P/'drive_c/Program Files/MetaTrader 5'
            WDIR=Path('/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin')
            WINE=next((p for p in (WDIR/'wine64',WDIR/'wine') if p.is_file()),None)
            if not WINE: raise SystemExit('STAGE7_WINE_NOT_FOUND')
            source=P/'drive_c/DualBotStage7/DualBotInteractive.mq5'
            source.parent.mkdir(parents=True,exist_ok=True)
            run=os.environ['CIRCLE_WORKFLOW_ID']
            (BASE/'run_id.txt').write_text(run,encoding='ascii')
            body=(BASE/'DualBotInteractive.mq5').read_text(encoding='utf-8').replace('__RUN_ID__',run)
            assert all(x not in body for x in ('OrderSend(', 'CTrade', 'TRADE_ACTION_DEAL', 'WebRequest(', 'SocketCreate(', 'OrderCheck('))
            source.write_text(body,encoding='utf-8')
            env=os.environ.copy(); env['WINEPREFIX']=str(P);env['WINEDEBUG']='-all'
            proc=subprocess.run([str(WINE),r'C:\Program Files\MetaTrader 5\metaeditor64.exe',
                r'/compile:C:\DualBotStage7\DualBotInteractive.mq5','/log'],
                stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,env=env,timeout=140)
            binary=source.with_suffix('.ex5'); log=source.with_suffix('.log')
            for _ in range(12):
                if binary.is_file() and log.is_file():break
                time.sleep(1)
            raw=log.read_bytes() if log.is_file() else b''
            msg=raw.decode('utf-16le' if raw.count(b'\x00')>len(raw)//8 else 'utf-8',errors='replace')
            import re
            if not (binary.is_file() and binary.stat().st_size>500 and re.search(r'Result:\s*0\s+errors?,\s*0\s+warnings?',msg,re.I)):
                raise SystemExit('STAGE7_METAEDITOR_COMPILE_FAILED')
            dirs={ROOT/'MQL5/Experts'}
            for p in ('drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/*/MQL5/Experts',
                      'drive_c/users/*/Application Data/MetaQuotes/Terminal/*/MQL5/Experts'):
                dirs.update(P.glob(p))
            for d in dirs:
                d.mkdir(parents=True,exist_ok=True)
                shutil.copy2(binary,d/binary.name)
            # Terminate installer-launched process before launching with explicit read-only EA.
            rows=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True).stdout
            for line in rows.splitlines():
                try: pid,cmd=line.strip().split(None,1)
                except ValueError:continue
                if 'terminal64.exe' in cmd.lower() and ('wine' in cmd.lower() or 'metatrader' in cmd.lower()):
                    try:os.kill(int(pid),signal.SIGTERM)
                    except (ValueError,OSError):pass
            time.sleep(4)
            ini=P/'drive_c/dualbot_stage7_readonly.ini'
            ini.write_text('[Common]\nProxyEnable=0\nKeepPrivate=0\n'
                '[Experts]\nEnabled=1\nAllowLiveTrading=0\nAllowDllImport=0\nAccount=0\nProfile=0\n'
                '[StartUp]\nExpert=DualBotInteractive\nSymbol=EURUSD\nPeriod=M15\n',encoding='utf-8')
            ini.chmod(0o600)
            subprocess.Popen([str(WINE),r'C:\Program Files\MetaTrader 5\terminal64.exe',
                r'/config:C:\dualbot_stage7_readonly.ini'],
                env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
            print('STAGE7_GUI_MT5_LAUNCHED=YES',flush=True)
            print('STAGE7_TRADING_DISABLED=YES',flush=True)
            print('STAGE7_NO_MT5_CREDENTIALS_AUTOMATED=YES',flush=True)
            STAGE7_PY
            cat > "$HOME/dualbot-stage7/probe.py" \<<'STAGE7_PROBE'
            import csv,json,os,time
            from pathlib import Path
            P=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
            run=os.environ.get('CIRCLE_WORKFLOW_ID','') or (Path.home()/'dualbot-stage7/run_id.txt').read_text(encoding='ascii').strip()
            paths=[]
            for pattern in (
                'drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/Common/Files/dualbot_stage7_status.csv',
                'drive_c/users/*/Application Data/MetaQuotes/Terminal/Common/Files/dualbot_stage7_status.csv',
                'drive_c/ProgramData/MetaQuotes/Terminal/Common/Files/dualbot_stage7_status.csv'):
                paths+=list(P.glob(pattern))
            result={'stage':'7','platform':'macos-arm64','read_only':True,'trade_orders_sent':0,
                    'ea_seen':False,'heartbeat_sequence':0,'broker_connected':False,
                    'account_present':False,'demo_account':False,'deriv_broker':False,
                    'target_symbol_exists':False,'target_symbol_selected':False,
                    'recent_quote':False,'m15_completed_bars':0,'deriv_demo_authenticated':False,
                    'm15_qualified':False}
            for p in paths:
                try:
                    if time.time()-p.stat().st_mtime>30:continue
                    rows=list(csv.reader(p.read_text(encoding='latin-1').splitlines(),delimiter=';'))
                    if len(rows)!=1 or len(rows[0])!=11 or rows[0][:2]!=['S7',run]:continue
                    v=list(map(int,rows[0][2:]))
                    result.update(ea_seen=True,heartbeat_sequence=v[0],broker_connected=bool(v[1]),
                        account_present=bool(v[2]),demo_account=bool(v[3]),deriv_broker=bool(v[4]),
                        target_symbol_exists=bool(v[5]),target_symbol_selected=bool(v[6]),
                        recent_quote=bool(v[7]),m15_completed_bars=max(0,v[8]))
                    result['deriv_demo_authenticated']=bool(v[1] and v[2] and v[3] and v[4])
                    result['m15_qualified']=bool(result['deriv_demo_authenticated'] and v[6] and v[7] and v[8]>=399)
                    break
                except (OSError,ValueError,UnicodeError,csv.Error):pass
            print('STAGE7_READ_ONLY_RESULT='+json.dumps(result,sort_keys=True),flush=True)
            STAGE7_PROBE
            python3 "$HOME/dualbot-stage7/launch.py"
            sleep 15
            python3 "$HOME/dualbot-stage7/probe.py"
            echo 'STAGE7_NEXT=RERUN_THIS_JOB_WITH_SSH_AND_OPEN_VNC_FOR_DERIV_BROKER_REGISTRATION'
workflows:
  stage7-interactive-deriv-registration:
    jobs:
      - dualbot-stage7-interactive
