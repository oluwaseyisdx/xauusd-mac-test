# DualBot Stage 7A: CircleCI VNC cancellation isolation (NO MT5, NO broker login).
# Costs a small amount of CircleCI macOS credits. This temporarily replaces
# .circleci/config.yml. Restore Stage 7 after interpreting the results.
# The two independent jobs compare macOS runner health with the exact
# macos/enable-vnc operation that was interrupted twice before.
version: 2.1
orbs:
  macos: circleci/macos@2.5.4
jobs:
  mac-baseline-no-vnc:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - run:
          name: Baseline Apple Silicon runner without VNC or MT5
          command: |
            set -euo pipefail
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            echo "STAGE7A_BASELINE_APPLE_SILICON=PASS"
            echo "STAGE7A_BASELINE_STEP=START"
            sleep 10
            echo "STAGE7A_BASELINE_STEP=COMPLETED"
  mac-vnc-isolation:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - run:
          name: Preflight VNC on a fresh Mac without installing MT5
          command: |
            set -euo pipefail
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
            if test -z "${MAC_VNC_PASSWORD:-}"; then
              echo "STAGE7A_VNC_PASSWORD_SECRET_MISSING"
              exit 2
            fi
            echo "STAGE7A_VNC_PASSWORD_SECRET_CONFIGURED=YES"
            echo "STAGE7A_BEFORE_VNC=REACHED"
      - macos/enable-vnc:
          username: vncuser
          password: MAC_VNC_PASSWORD
      - run:
          name: Confirm VNC orb returned control to CircleCI
          command: |
            set -euo pipefail
            echo "STAGE7A_AFTER_VNC=REACHED"
            echo "STAGE7A_VNC_ORB_COMPLETED=YES"
            sleep 10
            echo "STAGE7A_VNC_STABILITY_CHECK=PASS"
workflows:
  stage7a-isolate-runner-versus-vnc:
    jobs:
      - mac-baseline-no-vnc
      - mac-vnc-isolation
