name: MT5 Mac Test 10 - RustDesk administrator password fix (NO TRADES)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt5-mac-test10-rustdesk-password
  cancel-in-progress: true

jobs:
  fix-rustdesk-password:
    runs-on: macos-15
    timeout-minutes: 38
    steps:
      - name: Validate real Apple Silicon and private password secret
        shell: bash
        env:
          MAC_REMOTE_PASSWORD: ${{ secrets.MAC_REMOTE_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if test "${#MAC_REMOTE_PASSWORD}" -lt 18; then
            echo 'FAIL: MAC_REMOTE_PASSWORD secret missing or fewer than 18 characters.'
            exit 1
          fi
          echo 'Apple Silicon runner: PASS; remote password secret detected (never disclosed).'
          sw_vers

      - name: Install verified official RustDesk 1.5.0 Apple Silicon release
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 20 --max-time 240 \
            'https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-aarch64.dmg' \
            --output "$RUNNER_TEMP/rustdesk.dmg"
          mkdir -p "$RUNNER_TEMP/rustdesk-mounted"
          hdiutil attach "$RUNNER_TEMP/rustdesk.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/rustdesk-mounted"
          test -d "$RUNNER_TEMP/rustdesk-mounted/RustDesk.app"
          ditto "$RUNNER_TEMP/rustdesk-mounted/RustDesk.app" '/Applications/RustDesk.app'
          hdiutil detach "$RUNNER_TEMP/rustdesk-mounted" || true
          codesign --verify --deep --strict '/Applications/RustDesk.app'
          echo 'Official RustDesk app installed and code signature checked.'

      - name: Launch RustDesk and set PERMANENT password with administrator privileges
        shell: bash
        timeout-minutes: 5
        env:
          MAC_REMOTE_PASSWORD: ${{ secrets.MAC_REMOTE_PASSWORD }}
        run: |
          set -euo pipefail
          EXE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' '/Applications/RustDesk.app/Contents/Info.plist')"
          BIN="/Applications/RustDesk.app/Contents/MacOS/$EXE_NAME"
          test -x "$BIN"
          # Start the actual desktop and server processes, not an unregistered `open -a` alias.
          nohup "$BIN" --server > "$RUNNER_TEMP/rustdesk-server.log" 2>&1 < /dev/null &
          echo "RustDesk server initial PID=$!"
          nohup "$BIN" > "$RUNNER_TEMP/rustdesk-app.log" 2>&1 < /dev/null &
          echo "RustDesk app initial PID=$!"
          sleep 15
          # RustDesk 1.5.0 requires root/admin to set the password. A zero exit code
          # alone is NOT proof: the CLI can print an error while returning zero.
          set +e
          STATUS_TEXT="$(sudo -n "$BIN" --password "$MAC_REMOTE_PASSWORD" 2>&1)"
          STATUS_CODE=$?
          set -e
          echo "Password configuration process exit code=$STATUS_CODE"
          if [[ "$STATUS_TEXT" == *'Done!'* ]]; then
            echo 'RUSTDESK_PERMANENT_PASSWORD_CONFIRMED=YES'
          else
            echo 'RUSTDESK_PERMANENT_PASSWORD_CONFIRMED=NO'
            if [[ "$STATUS_TEXT" == *'Installation and administrative privileges required!'* ]]; then
              echo 'CAUSE: RustDesk still refuses installation/admin rights.'
            elif [[ "$STATUS_TEXT" == *'Settings are disabled!'* ]]; then
              echo 'CAUSE: RustDesk settings are disabled.'
            elif [[ "$STATUS_TEXT" == *'Changing permanent password is disabled!'* ]]; then
              echo 'CAUSE: RustDesk password changes are disabled.'
            else
              echo 'CAUSE: RustDesk did not confirm setting the permanent password. Raw output hidden.'
            fi
            exit 1
          fi
          ID=''
          for attempt in 1 2 3 4; do
            set +e
            CANDIDATE="$("$BIN" --get-id 2>/dev/null)"
            CODE=$?
            set -e
            if test "$CODE" -eq 0 && [[ "$CANDIDATE" =~ ^[A-Za-z0-9_-]{6,24}$ ]]; then
              ID="$CANDIDATE"
              break
            fi
            sleep 5
          done
          COUNT="$(ps -axo comm= | grep -ic '[R]ustDesk' || true)"
          echo "RUSTDESK_PROCESS_COUNT=$COUNT"
          if test -z "$ID" || test "$COUNT" -eq 0; then
            echo 'FAIL: RustDesk ID or background processes not found; remote connection unverified.'
            exit 1
          fi
          echo "RUSTDESK_ID=$ID"
          echo 'Password applied via administrator command. Network/screen permissions still require a real connection test.'

      - name: Install official MetaTrader 5 on the same Apple Silicon runner
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mt5-pkg"
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 20 --max-time 240 \
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
            --output "$RUNNER_TEMP/mt5.zip"
          ditto -x -k "$RUNNER_TEMP/mt5.zip" "$RUNNER_TEMP/mt5-pkg"
          PKG="$(find "$RUNNER_TEMP/mt5-pkg" -name '*.pkg' -print -quit)"
          test -n "$PKG"
          sudo installer -pkg "$PKG" -target /
          test -d '/Applications/MetaTrader 5.app'
          open '/Applications/MetaTrader 5.app' >/dev/null 2>&1 || true
          echo 'MT5 installed; Python/MT5 connectivity has NOT been verified.'

      - name: Keep temporary desktop available and verify RustDesk remains active
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          echo 'Use the NEW RUSTDESK_ID from the password configuration step.'
          echo 'Use your original MAC_REMOTE_PASSWORD (GitHub Actions secret), not your GitHub or MT5 password.'
          echo 'Only use a disposable demo account on this experimental runner; no trading orders are sent.'
          for n in $(seq 1 16); do
            COUNT="$(ps -axo comm= | grep -ic '[R]ustDesk' || true)"
            echo "RUSTDESK_HEARTBEAT=$n/16 active_processes=$COUNT"
            if test "$COUNT" -eq 0; then
              echo 'FAIL: RustDesk stopped running.'
              exit 1
            fi
            sleep 60
          done
