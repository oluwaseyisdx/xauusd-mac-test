name: MT5 Test 21 - Deriv standard-mode EA startup versus Mac control (NO TRADES)
on:
  push:
    paths:
      - .github/workflows/MT5_Test_21_Standard_Mode_EA_Startup_MacOS26.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mt5-test21-standard-startup-existing-deriv-build
  cancel-in-progress: true
jobs:
  mql5-file-bridge:
    runs-on: macos-26
    timeout-minutes: 44
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Confirm macOS 26 Apple Silicon and Rosetta
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(uname -s)" = Darwin
          echo "APPLE_SILICON=YES"
          sw_vers
          if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Install MetaQuotes official Mac app and bundled Wine
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mt5pkg"
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240   'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip'   -o "$RUNNER_TEMP/mt5pkg.zip"
          ditto -x -k "$RUNNER_TEMP/mt5pkg.zip" "$RUNNER_TEMP/mt5pkg"
          pkg="$(find "$RUNNER_TEMP/mt5pkg" -name '*.pkg' -print -quit)"
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          test -x '/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          open -a 'MetaTrader 5' || true
          sleep 15
          test -f "$HOME/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/metaeditor64.exe"
          echo "MT5_APP_WINE_METAEDITOR=YES"
      - name: Download the VERIFIED Deriv MT5 build from Test 19 (NO NEW INSTALLER)
        uses: actions/download-artifact@v4
        with:
          name: MT5_TEST19_WINDOWS_APP_TRANSFER
          repository: oluwaseyisdx/xauusd-mac-test
          run-id: 40316484137
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/test20_transfer
      - name: Verify Test 19 transfer and extract isolated Deriv terminal
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          export WINEPREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
          python3 - <<'PY_IMPORT'
          import hashlib,json,os,zipfile
          from pathlib import Path
          src=Path(os.environ['RUNNER_TEMP'])/'test20_transfer'
          manifest=json.loads((src/'manifest.json').read_text(encoding='utf-8-sig'))
          archive=src/'DerivMT5App.zip'
          if not archive.is_file():
              raise SystemExit('TEST21_TRANSFER_ZIP_MISSING')
          checksum=hashlib.sha256(archive.read_bytes()).hexdigest()
          if checksum != manifest['archive_sha256']:
              raise SystemExit('TEST21_TRANSFER_CHECKSUM_MISMATCH')
          expected=int(manifest['build'])
          if expected<6200:
              raise SystemExit('TEST21_WINDOWS_BUILD_TOO_OLD')
          root=Path(os.environ['WINEPREFIX'])/'drive_c/DerivMT5Test20'
          root.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              if not any(x.casefold()=='terminal64.exe' for x in names):
                  raise SystemExit('TEST21_TERMINAL_BINARY_NOT_IN_ZIP')
              for member in z.infolist():
                  name=member.filename.replace('\\','/')
                  parts=Path(name).parts
                  if name.startswith('/') or '..' in parts or ':' in name or member.is_dir() and len(parts)==0:
                      raise SystemExit('TEST21_UNSAFE_ARCHIVE_PATH')
              z.extractall(root)
          terminal=root/'terminal64.exe'
          metaeditor=root/'metaeditor64.exe'
          if not terminal.is_file() or terminal.stat().st_size<1024*1024:
              raise SystemExit('TEST21_TRANSFER_TERMINAL_MISSING')
          if not metaeditor.is_file():
              raise SystemExit('TEST21_TRANSFER_METAEDITOR_MISSING')
          expected_hash=manifest['terminal_sha256']
          with terminal.open('rb') as fh:
              h=hashlib.file_digest(fh,'sha256').hexdigest()
          if h!=expected_hash:
              raise SystemExit('TEST21_TRANSFER_TERMINAL_HASH_MISMATCH')
          report={'windows_build_expected':expected,'archive_verified':True,
                  'terminal_binary_verified':True,'metaeditor_present':True,
                  'extracted_file_count':sum(1 for f in root.rglob('*') if f.is_file()),
                  'portable_target':True,'source_run_id':'40316484137','artifact_expiry_utc':'2026-10-27T11:38:18Z'}
          (Path(os.environ['RUNNER_TEMP'])/'test20_transfer_report.json').write_text(json.dumps(report))
          print('TEST21_TRANSFER_REPORT='+json.dumps(report,sort_keys=True),flush=True)
          PY_IMPORT
      - name: Compile MQL5 read-only bridge with MetaEditor in Wine
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export WINEPREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5" WINEDEBUG=-all
          cat > "$RUNNER_TEMP/DualBotReadOnlyBridge.mq5" <<'BRIDGE_SOURCE_EOF'
          // DualBot Test 20 — MT5 build/network and read-only file bridge qualification
          // Writes a heartbeat and minimal quote/account flags to FILE_COMMON.
          // Deliberately has no CTrade, OrderSend, WebRequest, sockets, or DLL imports.
          #property strict
          #property version "1.00"
          #property description "Read-only qualification bridge; never submits trades"

          #define BRIDGE_RUN_ID "__BRIDGE_RUN_ID__"

          int g_sequence=0;

          void PublishSnapshot()
          {
             const bool connected=(bool)TerminalInfoInteger(TERMINAL_CONNECTED);
             const bool is_demo=(AccountInfoInteger(ACCOUNT_TRADE_MODE)==ACCOUNT_TRADE_MODE_DEMO);
             const string account_server=AccountInfoString(ACCOUNT_SERVER);
             const int terminal_build=(int)TerminalInfoInteger(TERMINAL_BUILD);
             MqlTick tick;
             ZeroMemory(tick);
             string quote_symbol=_Symbol;
             bool tick_present=SymbolInfoTick(quote_symbol,tick);
             // Broker-specific Deriv accounts need not offer EURUSD. Scan displayed
             // Market Watch instruments for a valid live tick without trading.
             if(!tick_present || tick.bid<=0.0 || tick.ask<=tick.bid || tick.time<=0)
             {
                int total=SymbolsTotal(true);
                if(total>120) total=120;
                for(int i=0;i<total;i++)
                {
                   string candidate=SymbolName(i,true);
                   MqlTick probe;
                   ZeroMemory(probe);
                   if(SymbolInfoTick(candidate,probe) && probe.bid>0.0 && probe.ask>probe.bid && probe.time>0)
                   {
                      quote_symbol=candidate;
                      tick=probe;
                      tick_present=true;
                      break;
                   }
                }
             }
             const bool quote_available=(connected && tick_present && tick.bid>0.0 && tick.ask>tick.bid && tick.time>0);
             int handle=FileOpen("DUALBOT_TEST14_BRIDGE.csv",
                      FILE_WRITE|FILE_CSV|FILE_ANSI|FILE_SHARE_READ|FILE_COMMON,
                      ';',CP_UTF8);
             if(handle==INVALID_HANDLE)
             {
                Print("DUALBOT_TEST14_FILE_OPEN_FAILED error=",GetLastError());
                return;
             }
             g_sequence++;
             FileWrite(handle,"run_id","seq","terminal_connected","demo_account","quotes_available","symbol","bid","ask","tick_unix_seconds","orders_sent","account_login","account_server","terminal_build");
             FileWrite(handle,BRIDGE_RUN_ID,g_sequence,(int)connected,(int)is_demo,(int)quote_available,
                       quote_symbol,DoubleToString(tick.bid,8),DoubleToString(tick.ask,8),
                       (long)tick.time,0,(long)AccountInfoInteger(ACCOUNT_LOGIN),account_server,terminal_build);
             FileFlush(handle);
             FileClose(handle);
             if(g_sequence==1)
                Print("DUALBOT_TEST14_MQL5_FILE_BRIDGE_WRITTEN");
          }

          int OnInit()
          {
             EventSetTimer(2);
             PublishSnapshot();
             return INIT_SUCCEEDED;
          }

          void OnTimer()
          {
             PublishSnapshot();
          }

          void OnDeinit(const int reason)
          {
             EventKillTimer();
          }
          BRIDGE_SOURCE_EOF

          python3 - <<'PY_COMPILE'
          import os, shutil, subprocess, time, json
          from pathlib import Path
          prefix=Path(os.environ['WINEPREFIX'])
          source=Path(os.environ['RUNNER_TEMP'])/'DualBotReadOnlyBridge.mq5'
          code=source.read_text(encoding='utf-8').replace('__BRIDGE_RUN_ID__',os.environ['GITHUB_RUN_ID'])
          assert 'OrderSend(' not in code and 'WebRequest(' not in code
          windows_folder=prefix/'drive_c/DualBotBridge14'
          windows_folder.mkdir(parents=True,exist_ok=True)
          target=windows_folder/'DualBotReadOnlyBridge.mq5'
          target.write_text(code,encoding='utf-8')
          wine='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          metaeditor=r'C:\Program Files\MetaTrader 5\metaeditor64.exe'
          win_source=r'C:\DualBotBridge14\DualBotReadOnlyBridge.mq5'
          print('MQL5_SOURCE_IN_WINE_PREFIX=',target.is_file())
          print('MQL5_SOURCE_BYTES=',target.stat().st_size)
          # MetaQuotes documents the /compile:<Windows path> and /log switches.
          # This short Windows filename avoids ambiguous quoting of the /compile argument.
          choices=[
              ('short_absolute',[wine,metaeditor,'/compile:'+win_source,'/log']),
              ('short_quoted',[wine,metaeditor,'/compile:"'+win_source+'"','/log']),
          ]
          compiled=target.with_suffix('.ex5'); log=target.with_suffix('.log')
          for tag,cmd in choices:
              for f in (compiled,log):
                  try: f.unlink()
                  except FileNotFoundError: pass
              print('METAEDITOR_COMPILER_ATTEMPT=',tag,flush=True)
              try:
                  proc=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.PIPE,
                              text=True,errors='replace',timeout=80,env=os.environ.copy())
                  print('METAEDITOR_EXIT_CODE=',proc.returncode,flush=True)
                  print('METAEDITOR_STDOUT_PRESENT=',bool(proc.stdout.strip()))
                  print('METAEDITOR_STDERR_PRESENT=',bool(proc.stderr.strip()))
                  # No raw process text to avoid accidental environment leakage.
              except subprocess.TimeoutExpired:
                  print('METAEDITOR_COMPILER_TIMED_OUT=YES',flush=True)
              for _ in range(5):
                  if compiled.is_file() or log.is_file(): break
                  time.sleep(2)
              print('COMPILER_LOG_PRESENT=',log.is_file(),flush=True)
              if log.is_file():
                  raw=log.read_bytes()
                  msg=raw.decode('utf-16le' if raw.count(b'\x00')>len(raw)//8 else 'utf-8',errors='replace')
                  print('COMPILER_LAST_LINES=',json.dumps(msg.splitlines()[-12:])[:3000],flush=True)
              if compiled.is_file() and compiled.stat().st_size>=500:
                  print('MQL5_EX5_COMPILED=YES',flush=True)
                  break
          else:
              # Diagnostic only: report filenames, not logs containing account information.
              candidates=[prefix/'drive_c/Program Files/MetaTrader 5/MQL5/Experts']
              candidates.extend((prefix/'drive_c/users').glob('*/AppData/Roaming/MetaQuotes/Terminal/*/MQL5/Experts'))
              for folder in candidates:
                  for match in list(folder.glob('*DualBotReadOnlyBridge*'))[:4]:
                      if match.suffix.lower() in {'.mq5','.log','.ex5'}:
                          print('COMPILER_ALT_FILE=',match.suffix,match.stat().st_size,flush=True)
              raise SystemExit('MQL5_COMPILATION_NOT_VERIFIED: MetaEditor did not produce expected .ex5; inspect console diagnostics')
          # Copy compiled EA to the terminal installation and every detected user data folder.
          install=prefix/'drive_c/Program Files/MetaTrader 5/MQL5/Experts'
          install.mkdir(parents=True,exist_ok=True)
          shutil.copy2(compiled,install/compiled.name)
          deriv_experts=prefix/'drive_c/DerivMT5Test20/MQL5/Experts'
          deriv_experts.mkdir(parents=True,exist_ok=True)
          shutil.copy2(compiled,deriv_experts/compiled.name)
          print('TEST21_DERIV_PORTABLE_EA_COPIED=YES',flush=True)
          count=0
          for folder in (prefix/'drive_c/users').glob('*/AppData/Roaming/MetaQuotes/Terminal/*/MQL5/Experts'):
              folder.mkdir(parents=True,exist_ok=True)
              shutil.copy2(compiled,folder/compiled.name)
              count+=1
          print('MQL5_COMPILED_EA_COPIED_TO_DATA_FOLDERS=',count)
          PY_COMPILE
      - name: Compare older Mac EA, bootstrap Deriv standard data folder, then test both launch modes
        shell: bash
        timeout-minutes: 9
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          set -euo pipefail
          export WINEPREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5" WINEDEBUG=-all
          cat > "$RUNNER_TEMP/read_bridge.py" <<'BRIDGE_SOURCE_EOF'
          """Read-only MQL5 FILE_COMMON CSV bridge for a native macOS Python process.

          No broker credentials, no Python MetaTrader5 extension, no order methods.
          Never use a snapshot as a trading signal without stale-data safeguards.
          """
          import csv
          import os
          from pathlib import Path
          from typing import Optional

          FILENAME = "DUALBOT_TEST14_BRIDGE.csv"
          REQUIRED_FIELDS = (
              "run_id", "seq", "terminal_connected", "demo_account",
              "quotes_available", "symbol", "bid", "ask", "tick_unix_seconds", "orders_sent", "account_login", "account_server", "terminal_build",
          )


          def candidates(prefix: Path):
              """FILE_COMMON lives under the Wine user's MetaQuotes Terminal/Common/Files."""
              yield from prefix.glob(f"drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/Common/Files/{FILENAME}")
              yield from prefix.glob(f"drive_c/users/*/Application Data/MetaQuotes/Terminal/Common/Files/{FILENAME}")
              # Do not use a non-common MQL5/Files file: it would not prove FILE_COMMON.


          def parse_snapshot(path: Path, expected_run_id: Optional[str] = None) -> dict:
              with open(path, "r", newline="", encoding="utf-8-sig") as fh:
                  rows = list(csv.DictReader(fh, delimiter=";"))
              if len(rows) != 1:
                  raise ValueError("Expected exactly one snapshot row")
              row = rows[0]
              if not all(key in row for key in REQUIRED_FIELDS):
                  raise ValueError("Missing fields in snapshot")
              if expected_run_id is not None and row["run_id"] != expected_run_id:
                  raise ValueError("Snapshot belongs to another workflow run")
              for key in ("seq", "terminal_connected", "demo_account", "quotes_available", "tick_unix_seconds", "orders_sent", "account_login", "terminal_build"):
                  row[key] = int(row[key])
              for key in ("bid", "ask"):
                  row[key] = float(row[key])
              if row["seq"] <= 0:
                  raise ValueError("Snapshot sequence not positive")
              if row["orders_sent"] != 0:
                  raise ValueError("Read-only safety check failed")
              if row["quotes_available"] and not (row["terminal_connected"] and 0 < row["bid"] < row["ask"]):
                  raise ValueError("Invalid quote flags or spread")
              return row


          def find_snapshot(prefix: Path, expected_run_id: str) -> dict:
              for path in candidates(prefix):
                  if path.is_file():
                      try:
                          return parse_snapshot(path, expected_run_id)
                      except (OSError, ValueError, UnicodeDecodeError):
                          continue
              raise FileNotFoundError("No matching FILE_COMMON snapshot found")


          def sanitized_report(snapshot: dict) -> dict:
              """No account IDs, server names or full quotes printed to public CI logs."""
              return {
                  "bridge_file_seen": True,
                  "run_id_matches": True,
                  "heartbeat_seq": snapshot["seq"],
                  "terminal_connected": bool(snapshot["terminal_connected"]),
                  "demo_account": bool(snapshot["demo_account"]),
                  "quotes_available": bool(snapshot["quotes_available"]),
                  "symbol_nonempty": bool(snapshot["symbol"]),
                  "account_login_present": snapshot["account_login"] > 0,
                  "account_server_present": bool(snapshot["account_server"]),
                  "terminal_build": snapshot["terminal_build"],
                  "orders_sent": snapshot["orders_sent"],
              }


          if __name__ == "__main__":
              import json
              prefix = Path(os.environ["WINEPREFIX"])
              run_id = os.environ["BRIDGE_RUN_ID"]
              print(json.dumps(sanitized_report(find_snapshot(prefix, run_id)), sort_keys=True))
          BRIDGE_SOURCE_EOF
          python3 - <<'PY_LAUNCH'
          import json, os, signal, subprocess, sys, time
          from pathlib import Path
          from configparser import ConfigParser
          
          prefix=Path(os.environ['WINEPREFIX'])
          tmp=Path(os.environ['RUNNER_TEMP'])
          login=os.getenv('MT5_DEMO_LOGIN','')
          pwd=os.getenv('MT5_DEMO_PASSWORD','')
          server=os.getenv('MT5_DEMO_SERVER','')
          if not (login and pwd and server) or not login.isdecimal() or 'demo' not in server.casefold():
              raise SystemExit('TEST21_DEMO_ONLY_GUARD_OR_MISSING_SECRETS')
          if any(any(c in x for c in '\r\n\x00') for x in (login,pwd,server)):
              raise SystemExit('TEST21_SECRET_FORMAT_REJECTED')
          
          # All user-facing output is boolean/count-only. The INI and private stderr
          # are runner-local and never uploaded or printed.
          ini=prefix/'drive_c/dualbot-test21-demo-readonly.ini'
          ini.write_text('[Common]\nLogin='+login+'\nPassword='+pwd+'\nServer='+server+
              '\nKeepPrivate=0\nProxyEnable=0\n'
              '[Experts]\nEnabled=1\nAllowLiveTrading=0\nAllowDllImport=0\nAccount=0\nProfile=0\n'
              '[StartUp]\nExpert=DualBotReadOnlyBridge\nSymbol=EURUSD\nPeriod=M1\n',encoding='utf-8')
          ini.chmod(0o600)
          check=ConfigParser(interpolation=None);check.optionxform=str;check.read(ini,encoding='utf-8')
          if not (check.get('Common','Login')==login and check.get('Common','Password')==pwd and
                  check.get('Common','Server')==server and check.get('Experts','AllowLiveTrading')=='0'):
              raise SystemExit('TEST21_CONFIG_CHECK_FAILED')
          print('TEST21_READONLY_STARTUP_CONFIG_VALID=TRUE',flush=True)
          
          wine='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          wineserver='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wineserver'
          control=prefix/'drive_c/Program Files/MetaTrader 5'
          candidate=prefix/'drive_c/DerivMT5Test20'
          assert (control/'terminal64.exe').is_file()
          assert (candidate/'terminal64.exe').is_file()
          compiled=prefix/'drive_c/DualBotBridge14/DualBotReadOnlyBridge.ex5'
          assert compiled.is_file() and compiled.stat().st_size>500
          sys.path.insert(0,str(tmp))
          from read_bridge import find_snapshot,candidates as shared_paths
          runid=os.environ['GITHUB_RUN_ID']
          report={'test':'21','control':{},'bootstrap':{},'modes':[],
                  'standard_attempted':False,'portable_attempted':False,
                  'candidate_bridge_seen':False,'candidate_build_verified':False,
                  'candidate_quote_seen':False,'sample_interval_seconds':2,
                  'private_log_uploaded':False}
          
          def terminate_wine():
              # Scoped to the temporary MT5 Wine prefix; used between controlled launches.
              if Path(wineserver).exists():
                  try:subprocess.run([wineserver,'-k'],env=os.environ.copy(),
                          stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=14)
                  except (OSError,subprocess.TimeoutExpired):pass
              # The Wine wrapper can survive a wineserver shutdown, so also stop terminal
              # processes by executable name. Never print their command lines.
              try: ps=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True,timeout=7).stdout
              except (OSError,subprocess.TimeoutExpired): ps=''
              for line in ps.splitlines():
                  parts=line.strip().split(None,1)
                  if len(parts)!=2 or not parts[0].isdecimal(): continue
                  cmd=parts[1].casefold()
                  if 'terminal64.exe' in cmd:
                      try:os.kill(int(parts[0]),signal.SIGTERM)
                      except (OSError,ValueError):pass
              time.sleep(2)
          
          def clear_shared():
              count=0
              for f in shared_paths(prefix):
                  try: f.unlink();count+=1
                  except FileNotFoundError:pass
                  except OSError:pass
              return count
          
          def process_state(fragment):
              try: ps=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True,timeout=7).stdout
              except (OSError,subprocess.TimeoutExpired):return (False,False)
              generic=False;chosen=False
              for line in ps.splitlines():
                  parts=line.strip().split(None,1)
                  if len(parts)!=2 or not parts[0].isdecimal():continue
                  command=parts[1].casefold()
                  if 'terminal64.exe' in command:
                      generic=True
                      chosen|=fragment in command
              return generic,chosen
          
          def expert_data_dirs():
              # MT5 standard mode stores profiles under the per-terminal hashed data folder.
              # origin.txt can identify folders belonging to this Deriv installation.
              bases=list((prefix/'drive_c/users').glob('*/AppData/Roaming/MetaQuotes/Terminal/*'))
              bases.extend((prefix/'drive_c/users').glob('*/Application Data/MetaQuotes/Terminal/*'))
              return [b for b in bases if b.is_dir() and (b/'MQL5').exists()]
          
          def folder_belongs_to_deriv(folder):
              origin=folder/'origin.txt'
              try:
                  raw=origin.read_bytes()[:6000]
                  content=raw.decode('utf-16le' if raw.count(b'\x00')>len(raw)//8 else 'utf-8',errors='replace')
              except OSError:return False
              return 'derivmt5test20' in content.casefold()
          
          def safe_log_flags():
              # Only fixed boolean indicators of EA startup; never raw journal strings.
              hits={'candidate_log_found':False,'expert_mentioned':False,
                    'expert_load_error':False,'terminal_startup_error':False}
              folder_list=[candidate/'logs',candidate/'MQL5/Logs']
              for b in expert_data_dirs():
                  if folder_belongs_to_deriv(b):folder_list.extend([b/'logs',b/'MQL5/Logs'])
              files=[]
              for folder in folder_list:
                  if folder.exists(): files+=list(folder.glob('*.log'))
              hits['candidate_log_found']=bool(files)
              for f in files[-15:]:
                  try:
                      raw=f.read_bytes()[-200000:]
                      t=raw.decode('utf-16le' if raw.count(b'\x00')>len(raw)//8 else 'utf-8',errors='replace').casefold()
                      hits['expert_mentioned']|='dualbotreadonlybridge' in t
                      hits['expert_load_error']|=any(k in t for k in (
                          'cannot load expert','failed to load expert','expert not found','cannot open file'))
                      hits['terminal_startup_error']|=any(k in t for k in ('initialization failed','fatal error'))
                  except OSError:pass
              return hits
          
          def safe_stderr(file):
              try:t=file.read_bytes()[-200000:].decode('utf-8',errors='replace').casefold()
              except OSError:t=''
              return {'stderr_nonempty':bool(t.strip()),
                  'missing_dll':any(v in t for v in ('c0000135','module not found','could not load')),
                  'exception':any(v in t for v in ('unhandled exception','page fault','segmentation fault')),
                  'wine_error':any(v in t for v in ('err:module','wine: failed','wine: could not'))}
          
          def launch(executable,mode,seconds=30,config=True):
              file=tmp/f'test21_private_{mode}.stderr'
              argv=[wine,'C:\\'+executable+'\\terminal64.exe']
              if config: argv.append(r'/config:C:\dualbot-test21-demo-readonly.ini')
              if mode=='portable': argv.append('/portable')
              folder=control if executable.startswith('Program Files') else candidate
              data={'mode':mode,'popen_succeeded':False,'wrapper_survived_12s':False,
                    'candidate_process_seen':False,'terminal_process_seen':False,
                    'snapshot_seen':False,'snapshot_build':None,'snapshot_seq':0,
                    'samples':0,'wrapper_exit_code':None,'stderr_flags':{},'log_flags':{}}
              with open(file,'wb') as stderr_fh:
                  try:p=subprocess.Popen(argv,env=os.environ.copy(),cwd=str(folder),
                    stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=stderr_fh,
                    start_new_session=True)
                  except OSError:
                      data['launch_os_error']=True;return data
              data['popen_succeeded']=True
              for i in range(max(1,seconds//2)):
                  time.sleep(2);data['samples']+=1
                  rc=p.poll()
                  if i>=5 and rc is None:data['wrapper_survived_12s']=True
                  generic,chosen=process_state('derivmt5test20' if executable.startswith('DerivMT5') else 'program files')
                  data['terminal_process_seen']|=generic
                  data['candidate_process_seen']|=chosen
                  try:
                      snap=find_snapshot(prefix,runid)
                      build=int(snap['terminal_build'])
                      if mode=='control' or (build>=6200 and mode!='bootstrap'):
                          data['snapshot_seen']=True
                          data['snapshot_build']=build
                          data['snapshot_seq']=int(snap['seq'])
                          if mode not in ('control','bootstrap') and data['snapshot_seq']>=2:
                              report['candidate_bridge_seen']=True
                              report['candidate_build_verified']=True
                              report['candidate_quote_seen']|=bool(snap['terminal_connected'] and snap['quotes_available'])
                              break
                  except (FileNotFoundError,OSError,ValueError,KeyError):pass
                  if rc is not None and not generic and i>=6: break
              data['wrapper_exit_code']=p.poll()
              data['stderr_flags']=safe_stderr(file)
              data['log_flags']=safe_log_flags() if executable.startswith('DerivMT5') else {}
              return data
          
          # 1. Control confirms the known-good EA bridge functions within this same runner.
          terminate_wine();clear_shared()
          report['control']=launch('Program Files\\MetaTrader 5','control',seconds=24)
          print('TEST21_CONTROL_BRIDGE='+str(report['control']['snapshot_seen']).upper(),flush=True)
          terminate_wine();clear_shared()
          
          # 2. Start newer Deriv terminal once WITHOUT EA or broker config so its actual
          # hashed user data directory exists. Then copy the compiled EA into these data
          # folders BEFORE launching with StartUp=Expert. This was missing in Tests 19/20B.
          existing={str(p) for p in expert_data_dirs()}
          report['bootstrap']=launch('DerivMT5Test20','bootstrap',seconds=22,config=False)
          terminate_wine();clear_shared()
          paths=expert_data_dirs()
          matched=[p for p in paths if folder_belongs_to_deriv(p)]
          # Fallback copying into all visible terminal data directories is safe: the EA
          # contains no order operations. We do not assume origin.txt is always present.
          for p in paths:
              destination=p/'MQL5/Experts/DualBotReadOnlyBridge.ex5'
              destination.parent.mkdir(parents=True,exist_ok=True)
              import shutil
              shutil.copy2(compiled,destination)
          report['bootstrap'].update({'user_data_dirs_detected':len(paths),
              'new_user_data_dirs':sum(str(p) not in existing for p in paths),
              'deriv_origin_dirs_detected':len(matched),
              'ea_copied_to_user_data_dirs':len(paths),
              'portable_ea_present':(candidate/'MQL5/Experts/DualBotReadOnlyBridge.ex5').is_file()})
          print('TEST21_STANDARD_BOOTSTRAP='+json.dumps({k:v for k,v in report['bootstrap'].items()
              if k in ('user_data_dirs_detected','new_user_data_dirs','deriv_origin_dirs_detected',
                       'ea_copied_to_user_data_dirs','portable_ea_present')},sort_keys=True),flush=True)
          
          # 3. ALWAYS test standard mode, even if the candidate process remains alive.
          report['standard_attempted']=True
          standard=launch('DerivMT5Test20','standard',seconds=50)
          report['modes'].append(standard)
          print('TEST21_STANDARD='+json.dumps(standard,sort_keys=True),flush=True)
          
          # 4. If standard mode did not emit a recent-build snapshot, stop it and try
          # portable mode independently. Never interpret process survival alone as pass.
          if not report['candidate_bridge_seen']:
              terminate_wine();clear_shared()
              report['portable_attempted']=True
              portable=launch('DerivMT5Test20','portable',seconds=50)
              report['modes'].append(portable)
              print('TEST21_PORTABLE='+json.dumps(portable,sort_keys=True),flush=True)
          
          report['final_log_flags']=safe_log_flags()
          (tmp/'test21_launch_diagnostics.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('TEST21_LAUNCH_SUMMARY='+json.dumps({k:report[k] for k in (
           'standard_attempted','portable_attempted','candidate_bridge_seen','candidate_build_verified',
           'candidate_quote_seen')},sort_keys=True),flush=True)
          PY_LAUNCH
      - name: Verify actual MT5 build, broker TCP, Deriv authorization and live quotes
        shell: bash
        timeout-minutes: 7
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          set -euo pipefail
          export WINEPREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
          export BRIDGE_RUN_ID="$GITHUB_RUN_ID"
          python3 - <<'PY_WATCH'
          import json,os,re,sys,time,subprocess,socket
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,os.environ['RUNNER_TEMP'])
          from read_bridge import find_snapshot, sanitized_report
          prefix=Path(os.environ['WINEPREFIX']); run_id=os.environ['BRIDGE_RUN_ID']
          expected_login=os.environ.get('MT5_DEMO_LOGIN','')
          expected_server=os.environ.get('MT5_DEMO_SERVER','')
          result={'test':'21','platform':'macos-26-arm64','mql5_ex5_compiled':True,
                  'mt5_python_ipc_used':False,'orders_sent':0,'bridge_file_seen':False,
                  'demo_connected':False,'expected_demo_account_verified':False,
                  'fresh_market_quote_verified':False,'terminal_connected':False,
                  'journal_flags':{},'journal_files_found':False,
                  'account_login_loaded':False,'account_login_matches_secret':False,
                  'account_server_loaded':False,'account_server_matches_secret':False,
                  'srv_registry_files_present':False,'servers_dat_present':False,
                  'server_config_format':'unknown',
                  'network':{'wine_process_seen':False,'lsof_probe_usable':False,
                      'wine_remote_tcp_seen':False,'wine_tcp_established_seen':False,
                      'wine_tcp_syn_sent_seen':False,'tcp_state_counts':{},
                      'samples_with_wine_process':0},
                  'official_release_reference_build':6286,
                  'terminal_build_below_reference':False}
          transfer_path=Path(os.environ['RUNNER_TEMP'])/'test20_transfer_report.json'
          result['transfer']=json.loads(transfer_path.read_text())
          result['windows_expected_build']=int(result['transfer']['windows_build_expected'])
          diag_file=Path(os.environ['RUNNER_TEMP'])/'test21_launch_diagnostics.json'
          result['launch']=json.loads(diag_file.read_text()) if diag_file.exists() else {'diagnostics_found':False}
          # lsof output is inspected locally; NEVER print or upload IPs, hostnames or ports.
          tcp_counts=Counter()
          def probe_wine_sockets():
              listing=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True,timeout=8)
              if listing.returncode!=0:
                  return
              pids=[]
              for line in listing.stdout.splitlines():
                  try: pid,cmd=line.strip().split(None,1)
                  except ValueError: continue
                  low=cmd.lower()
                  if ('terminal64.exe' in low or 'wineserver' in low or 'wine64' in low or
                      'metaeditor64.exe' in low) and pid.isdecimal():
                      pids.append(pid)
              if not pids:
                  return
              result['network']['wine_process_seen']=True
              result['network']['samples_with_wine_process']+=1
              # -a intersects PID and TCP filters on macOS; nonzero lsof may mean no sockets.
              p=subprocess.run(['lsof','-a','-nP','-iTCP','-p',','.join(pids[:35])],
                              capture_output=True,text=True,timeout=8)
              if p.returncode not in (0,1):
                  return
              result['network']['lsof_probe_usable']=True
              for line in p.stdout.splitlines()[1:]:
                  if '->' not in line: continue  # skip local-only/listening sockets
                  result['network']['wine_remote_tcp_seen']=True
                  state=re.search(r'\(([A-Z_]+)\)\s*$',line)
                  tag=state.group(1) if state else 'UNKNOWN'
                  if tag not in ('ESTABLISHED','SYN_SENT','SYN_RECV','CLOSE_WAIT',
                                 'FIN_WAIT_1','FIN_WAIT_2','TIME_WAIT','LAST_ACK','CLOSING'):
                      tag='OTHER'
                  tcp_counts[tag]+=1
                  if tag=='ESTABLISHED':
                      result['network']['wine_tcp_established_seen']=True
                  if tag=='SYN_SENT':
                      result['network']['wine_tcp_syn_sent_seen']=True
          seen=None
          for trial in range(100):
              try:
                  probe_wine_sockets()
              except (OSError,subprocess.TimeoutExpired,ValueError):
                  pass  # a missed socket sample cannot establish network failure
              try:
                  snap=find_snapshot(prefix,run_id)
                  seen=snap
                  result.update(sanitized_report(snap))
                  result['bridge_file_seen']=True
                  matching=bool(expected_login and str(snap['account_login'])==expected_login)
                  result['account_login_loaded']=bool(snap['account_login']>0)
                  result['account_login_matches_secret']=matching
                  result['account_server_loaded']=bool(snap['account_server'])
                  result['account_server_matches_secret']=bool(expected_server and snap['account_server'].casefold()==expected_server.casefold())
                  result['expected_demo_account_verified']=bool(matching and snap['demo_account'] and snap['terminal_connected'])
                  result['demo_connected']=bool(snap['demo_account'] and snap['terminal_connected'])
                  ts=int(snap['tick_unix_seconds'])
                  seconds_ago=time.time()-ts
                  fresh=bool(ts>0 and -60<=seconds_ago<=180)
                  result['fresh_market_quote_verified']=bool(result['expected_demo_account_verified'] and snap['quotes_available'] and fresh)
                  if result['fresh_market_quote_verified'] and snap['seq']>=3:
                      break
              except (OSError,ValueError,FileNotFoundError,UnicodeDecodeError,KeyError,TypeError):
                  pass
              time.sleep(2)
          result['network']['tcp_state_counts']=dict(tcp_counts)
          result['terminal_build_below_reference']=bool(result.get('terminal_build',0)>0 and
                                                   result['terminal_build']<result['official_release_reference_build'])
          # Read MT5 journal files only locally. Convert to strictly fixed, nonsecret booleans.
          # Never upload or print raw journal lines, broker server names, account IDs, or quotes.
          folders=[prefix/'drive_c/Program Files/MetaTrader 5/logs',
                   prefix/'drive_c/DerivMT5Test20/logs']
          folders.extend((prefix/'drive_c/users').glob('*/AppData/Roaming/MetaQuotes/Terminal/*/logs'))
          folders.extend((prefix/'drive_c/users').glob('*/Application Data/MetaQuotes/Terminal/*/logs'))
          # Portable data files are stored under the application itself; do not
          # assume user AppData contains the new executable's diagnostic logs.
          files=[]
          for folder in folders:
              if folder.is_dir():
                  files.extend(folder.glob('*.log'))
          result['journal_files_found']=bool(files)
          result['server_config_format']=('explicit_address' if ('.' in expected_server or ':' in expected_server) else 'broker_alias')
          result['srv_registry_files_present']=bool(list(prefix.rglob('*.srv')))
          dat_files=list(prefix.rglob('servers.dat'))
          result['servers_dat_present']=bool(dat_files)
          # Check whether the configured alias appears as plaintext in metadata.
          # A negative result is inconclusive because MT5 may encode/encrypt its registry.
          result['servers_dat_mentions_alias_plaintext']=False
          alias_ascii=expected_server.casefold().encode('utf-8',errors='ignore')
          alias_utf16=expected_server.casefold().encode('utf-16le',errors='ignore')
          for dat in dat_files[:8]:
              try:
                  raw=dat.read_bytes()[:4_000_000]
                  result['servers_dat_mentions_alias_plaintext'] |= bool(alias_ascii and (
                      alias_ascii in raw.lower() or alias_utf16 in raw.lower()))
              except OSError: pass
          # 'servers.dat' and .srv are configuration indicators, not direct proof of broker discovery.
          result['alias_without_detected_registry']=bool(result['server_config_format']=='broker_alias' and
                 not (result['srv_registry_files_present'] or result['servers_dat_present']))
          flags={'old_version':False,'authorization_failed':False,'invalid_account':False,
                 'account_disabled':False,'server_unavailable':False,
                 'network_or_proxy_issue':False,'server_connection_attempted':False,
                  'configuration_error':False,'broker_discovery':False}
          for f in sorted(files,key=lambda p:p.stat().st_mtime,reverse=True)[:20]:
              try:
                  with f.open('rb') as stream:
                      stream.seek(0,2); stream.seek(max(0,stream.tell()-262144))
                      data=stream.read()
                  enc='utf-16le' if data.count(b'\x00')>len(data)//8 else 'utf-8'
                  txt=data.decode(enc,errors='replace').lower()
                  flags['old_version'] |= 'old version' in txt or 'outdated version' in txt
                  flags['authorization_failed'] |= any(k in txt for k in ('authorization failed','authentication failed','login failed','failed to authorize','authorization error'))
                  flags['invalid_account'] |= any(k in txt for k in ('invalid account','invalid login','invalid password','incorrect password'))
                  flags['account_disabled'] |= any(k in txt for k in ('account disabled','account is disabled','account blocked'))
                  flags['server_unavailable'] |= any(k in txt for k in ('server not found','no access point','unknown server','failed to connect to server','servers.dat'))
                  flags['network_or_proxy_issue'] |= any(k in txt for k in ('proxy error','network error','connection timed out','no connection'))
                  flags['server_connection_attempted'] |= any(k in txt for k in ('connecting to','connected to','authorization on','authorization failed'))
                  flags['configuration_error'] |= any(k in txt for k in ('configuration file','incorrect parameter','invalid config'))
                  flags['broker_discovery'] |= any(k in txt for k in ('scanning network','search for broker','searching for broker','broker search','server scan'))
              except (OSError,ValueError):
                  pass
          result['journal_flags']=flags
          # Derived booleans never include any credential or server value.
          Path('mt5_test21_safe_report.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('TEST21_SAFE_RESULT='+json.dumps(result,sort_keys=True),flush=True)
          if not result['bridge_file_seen']:
              launch=result.get('launch',{})
              if not launch.get('candidate_process_observed'):
                  raise SystemExit('FAIL: no Deriv candidate terminal process confirmed; inspect launch lifecycle and sanitized Wine stderr flags')
              raise SystemExit('FAIL: Deriv candidate process observed, but read-only EA snapshot never appeared; inspect portable data folders and EA startup')
          if result.get('terminal_build',0)<result['transfer']['windows_build_expected']:
              raise SystemExit('NOT_VERIFIED: no running Deriv MT5 build >= transferred build was reported by the live MQL5 EA')
          if result.get('heartbeat_seq',0)<2:
              raise SystemExit('FAIL: read-only MQL5 heartbeat did not advance')
          print('PASS: Read-only MQL5 -> native macOS Python data bridge',flush=True)
          print('TEST21_ACCOUNT_LOGIN_LOADED='+str(result['account_login_loaded']).upper(),flush=True)
          print('TEST21_LOGIN_MATCHES_EXPECTED='+str(result['account_login_matches_secret']).upper(),flush=True)
          print('TEST21_ACCOUNT_SERVER_LOADED='+str(result['account_server_loaded']).upper(),flush=True)
          print('TEST21_SERVER_MATCHES_EXPECTED='+str(result['account_server_matches_secret']).upper(),flush=True)
          print('TEST21_SERVER_METADATA_MISSING='+str(result['alias_without_detected_registry']).upper(),flush=True)
          print('TEST21_WINE_OUTBOUND_TCP_OBSERVED='+str(result['network']['wine_remote_tcp_seen']).upper(),flush=True)
          print('TEST21_WINE_TCP_ESTABLISHED_OBSERVED='+str(result['network']['wine_tcp_established_seen']).upper(),flush=True)
          print('TEST21_TERMINAL_BELOW_REFERENCE_BUILD='+str(result['terminal_build_below_reference']).upper(),flush=True)
          print('TEST21_EFFECTIVE_TERMINAL_BUILD='+str(result.get('terminal_build',0)),flush=True)
          print('TEST21_NEW_DERIV_BUILD_RUNNING='+str(result.get('terminal_build',0)>=result['transfer']['windows_build_expected']).upper(),flush=True)
          if not result['expected_demo_account_verified']:
              raise SystemExit('NOT_VERIFIED: Deriv demo disconnected; inspect build age, sanitized Wine TCP states, and server discovery flags')
          if not result['fresh_market_quote_verified']:
              raise SystemExit('NOT_VERIFIED: target Deriv demo is connected but there is no fresh positive bid/ask quote from the bridge')
          print('PASS: target Deriv demo authenticated with fresh quote via read-only native Mac bridge; no orders sent',flush=True)
          PY_WATCH
      - name: Upload sanitized report even if broker login fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT5_TEST21_BROKER_NETWORK_DIAGNOSTICS
          path: mt5_test21_safe_report.json
          if-no-files-found: warn
          retention-days: 3

