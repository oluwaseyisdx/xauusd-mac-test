name: MT5 Apple Silicon - authenticated DEMO IPC check (NO TRADES)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-ipc-check:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Require disposable demo account secrets (never print them)
        shell: bash
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          set -euo pipefail
          test -n "$MT5_DEMO_LOGIN" || { echo 'MISSING: GitHub Actions secret MT5_DEMO_LOGIN'; exit 1; }
          test -n "$MT5_DEMO_PASSWORD" || { echo 'MISSING: GitHub Actions secret MT5_DEMO_PASSWORD'; exit 1; }
          test -n "$MT5_DEMO_SERVER" || { echo 'MISSING: GitHub Actions secret MT5_DEMO_SERVER'; exit 1; }
          echo 'Demo secrets available (contents not logged).'
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers

      - name: Install Rosetta
        shell: bash
        run: |
          set -euo pipefail
          if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install official MetaTrader 5 for macOS
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mt5pkg"
          curl --fail --location --show-error --silent --retry 2 --connect-timeout 20 --max-time 240 \
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
            --output "$RUNNER_TEMP/MetaTrader5.pkg.zip"
          ditto -x -k "$RUNNER_TEMP/MetaTrader5.pkg.zip" "$RUNNER_TEMP/mt5pkg"
          pkg="$(find "$RUNNER_TEMP/mt5pkg" -name '*.pkg' -print -quit)"
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          test -d '/Applications/MetaTrader 5.app'
          open -a 'MetaTrader 5' || true
          sleep 12

      - name: Set up native Apple Silicon Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native bridge and pin Python 3.9-compatible bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'mt5_mac==0.3.0'
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.find_spec('mt5_mac.bootstrap')
          assert spec and spec.origin
          path = Path(spec.origin)
          code = path.read_text('utf-8')
          old = 'https://bootstrap.pypa.io/get-pip.py'
          assert code.count(old) == 1, 'Upstream bootstrap changed; stop safely'
          path.write_text(code.replace(old, 'https://bootstrap.pypa.io/pip/3.9/get-pip.py'), encoding='utf-8')
          print('Bootstrap compatibility patch applied.')
          PY

      - name: Provision Windows Python inside MT5 Wine prefix
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, sys
          try:
              p = subprocess.run([sys.executable, '-c',
                  'import mt5_mac as m; print("initial", bool(m.initialize())); m.shutdown()'],
                  capture_output=True,text=True,timeout=170)
              print('First bootstrap return code:', p.returncode)
          except subprocess.TimeoutExpired:
              print('First bootstrap timed out. Inspect the generated prefix next.')
          PY
          python - <<'PY'
          from pathlib import Path
          p = Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Python39/python39._pth'
          if not p.exists(): raise SystemExit('Wine Python did not provision')
          lines = p.read_text('utf-8').splitlines()
          if '#import site' in lines: lines[lines.index('#import site')] = 'import site'
          elif 'import site' not in lines: lines.append('import site')
          if r'Lib\site-packages' not in lines: lines.insert(-1, r'Lib\site-packages')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('Embedded Python site-packages enabled.')
          PY

      - name: Confirm Windows pip and official MT5 package
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export WINEPREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
          export WINEDEBUG=-all
          WINE='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          WINPY='C:\Python39\python.exe'
          test -x "$WINE"
          if ! "$WINE" "$WINPY" -m pip --version; then
            curl --fail --location --show-error --silent --retry 2 --max-time 120 \
              'https://bootstrap.pypa.io/pip/3.9/get-pip.py' \
              --output "$WINEPREFIX/drive_c/Python39/get-pip.py"
            "$WINE" "$WINPY" 'C:\Python39\get-pip.py' --no-warn-script-location
          fi
          "$WINE" "$WINPY" -m pip --version
          "$WINE" "$WINPY" -m pip install --disable-pip-version-check --no-input --only-binary=:all: 'MetaTrader5==5.0.6231'
          "$WINE" "$WINPY" -c 'import MetaTrader5 as m; print("Official Windows MT5 import PASS; version:",m.__version__)'

      - name: Launch MT5 with temporary demo-account startup configuration
        shell: bash
        timeout-minutes: 3
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,signal,subprocess,time
          from pathlib import Path
          login=os.environ['MT5_DEMO_LOGIN']; password=os.environ['MT5_DEMO_PASSWORD']; server=os.environ['MT5_DEMO_SERVER']
          if not login.isdecimal(): raise SystemExit('Demo login must be numeric; no secrets logged')
          if not server or any(c in server for c in '\r\n') or 'demo' not in server.lower(): raise SystemExit('Demo server required (must contain demo)')
          if not password or any(c in password for c in '\r\n'): raise SystemExit('Invalid demo password')
          prefix=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
          p=prefix/'drive_c/Python39/demo-only.ini'
          p.write_text('[Common]\nLogin='+login+'\nServer='+server+'\nPassword='+password+'\nKeepPrivate=0\n[Experts]\nAllowLiveTrading=0\nEnabled=0\n',encoding='utf-8')
          p.chmod(0o600)
          # Close the unconfigured terminal started by the macOS installer; avoid killing Python or shell.
          procs=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True,check=True)
          for entry in procs.stdout.splitlines():
              try: pid_txt,command=entry.strip().split(None,1)
              except ValueError: continue
              if 'wine64-preloader' in command and 'terminal64.exe' in command:
                  try: os.kill(int(pid_txt),signal.SIGTERM)
                  except ProcessLookupError: pass
          time.sleep(5)
          wine='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          env={**os.environ,'WINEPREFIX':str(prefix),'WINEDEBUG':'-all'}
          subprocess.Popen([wine,r'C:\Program Files\MetaTrader 5\terminal64.exe',r'/config:C:\Python39\demo-only.ini'],
              env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,start_new_session=True)
          print('MT5 launched with demo startup configuration; no credentials printed.')
          PY
          sleep 60

      - name: Test official MT5 IPC then native bridge without placing orders
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          export WINEPREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
          export WINEDEBUG=-all
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          prefix=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
          script=prefix/'drive_c/Python39/demo_ipc_probe.py'
          script.write_text(r'''
          import json,MetaTrader5 as mt5
          o={'initialized':False,'account_present':False,'orders_sent':0}
          try:
              o['initialized']=bool(mt5.initialize(r'C:\Program Files\MetaTrader 5\terminal64.exe',timeout=45000))
              o['last_error_code']=mt5.last_error()[0]
              if o['initialized']:
                  account=mt5.account_info()
                  o['account_present']=account is not None
                  o['is_demo_account']=bool(account is not None and account.trade_mode==mt5.ACCOUNT_TRADE_MODE_DEMO)
                  o['terminal_info_present']=mt5.terminal_info() is not None
          except Exception as e: o['exception_type']=type(e).__name__
          finally:
              try: mt5.shutdown()
              except Exception: pass
          print('DEMO_IPC_RESULT='+json.dumps(o),flush=True)
          ''',encoding='utf-8')
          result={'platform':'Apple Silicon macOS','demo_only':True,'orders_sent':0,'official_ipc':{},'native_bridge':{}}
          cmd=['/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64',r'C:\Python39\python.exe',r'C:\Python39\demo_ipc_probe.py']
          try:
              q=subprocess.run(cmd,capture_output=True,text=True,timeout=90,env={**os.environ,'WINEPREFIX':str(prefix),'WINEDEBUG':'-all'})
              result['official_ipc']['process_returncode']=q.returncode
              for line in q.stdout.splitlines():
                  if line.startswith('DEMO_IPC_RESULT='):result['official_ipc'].update(json.loads(line.partition('=')[2]))
          except subprocess.TimeoutExpired:
              result['official_ipc']['timeout']=True
          print('OFFICIAL_IPC:',json.dumps(result['official_ipc']))
          bridge=r'''
          import mt5_mac as m,json
          o={'initialized':False,'account_present':False}
          try:
              o['initialized']=bool(m.initialize())
              if o['initialized']:o['account_present']=m.account_info() is not None
          except Exception as e:o['exception_type']=type(e).__name__
          finally:
              try:m.shutdown()
              except Exception:pass
          print('BRIDGE_RESULT='+json.dumps(o),flush=True)
          '''
          try:
              q=subprocess.run([sys.executable,'-c',bridge],capture_output=True,text=True,timeout=80)
              result['native_bridge']['process_returncode']=q.returncode
              for line in q.stdout.splitlines():
                  if line.startswith('BRIDGE_RESULT='):result['native_bridge'].update(json.loads(line.partition('=')[2]))
          except subprocess.TimeoutExpired:result['native_bridge']['timeout']=True
          print('NATIVE_BRIDGE:',json.dumps(result['native_bridge']))
          Path('test7_sanitized.json').write_text(json.dumps(result,indent=2)+'\n')
          if not (result['official_ipc'].get('initialized') and result['official_ipc'].get('is_demo_account') and result['native_bridge'].get('initialized')):
              raise SystemExit('NOT VERIFIED: Demo-authenticated MT5 IPC and/or native bridge did not initialize')
          print('PASS: DEMO authenticated official IPC and native bridge both initialized; NO TRADES sent')
          PY

      - name: Upload only sanitized booleans and error codes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT5_MAC_TEST7_DEMO_IPC_SANITIZED
          path: test7_sanitized.json
          if-no-files-found: warn
          retention-days: 1
