name: MT5 Test 13B - IPC recovery on macOS 26 (NO TRADES)

on:
  push:
    paths:
      - .github/workflows/MT5_Test_13B_IPC_Recovery_MacOS26.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mt5-test13b-ipc-recovery-macos26
  cancel-in-progress: true

jobs:
  mac-ipc-recovery:
    runs-on: macos-26
    timeout-minutes: 32
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Confirm real Apple Silicon and prepare Rosetta
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          echo "APPLE_SILICON_ARM64=YES"
          sw_vers
          if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install official MetaTrader 5 Mac app and Wine
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mt5pkg"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 \
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' \
            -o "$RUNNER_TEMP/mt5pkg.zip"
          ditto -x -k "$RUNNER_TEMP/mt5pkg.zip" "$RUNNER_TEMP/mt5pkg"
          pkg="$(find "$RUNNER_TEMP/mt5pkg" -name '*.pkg' -print -quit)"
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          test -x '/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          open -a 'MetaTrader 5' || true
          sleep 20
          test -f "$HOME/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/terminal64.exe"
          echo 'OFFICIAL_MT5_WINE_TERMINAL_INSTALLED=YES'

      - name: Install proven Windows x64 Python 3.12.10 inside official MT5 Wine prefix
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          PREFIX="$HOME/Library/Application Support/net.metaquotes.wine.metatrader5"
          PYPATH="$PREFIX/drive_c/Python312"
          export WINEPREFIX="$PREFIX" WINEDEBUG=-all
          WINE='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          mkdir -p "$PYPATH/Lib/site-packages"
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embeddable-amd64.zip' \
            -o "$RUNNER_TEMP/python-embeddable.zip"
          ditto -x -k "$RUNNER_TEMP/python-embeddable.zip" "$PYPATH"
          python3 - <<'PY'
          from pathlib import Path
          f=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Python312/python312._pth'
          lines=f.read_text().splitlines()
          if '#import site' in lines: lines[lines.index('#import site')]='import site'
          elif 'import site' not in lines: lines.append('import site')
          if r'Lib\site-packages' not in lines: lines.insert(-1,r'Lib\site-packages')
          f.write_text('\n'.join(lines)+'\n')
          PY
          "$WINE" 'C:\Python312\python.exe' --version
          curl --fail --location --silent --show-error --retry 2 --max-time 180 \
            'https://bootstrap.pypa.io/get-pip.py' -o "$PYPATH/get-pip.py"
          "$WINE" 'C:\Python312\python.exe' 'C:\Python312\get-pip.py' --no-warn-script-location
          "$WINE" 'C:\Python312\python.exe' -m pip install --disable-pip-version-check --no-input \
            --only-binary=:all: 'MetaTrader5==5.0.6180' 'numpy==1.26.4'
          "$WINE" 'C:\Python312\python.exe' -c 'import MetaTrader5 as m,numpy; assert m.__version__=="5.0.6180"; assert numpy.__version__=="1.26.4"; print("TEST13_AGENT_PIN_IMPORT=PASS")'

      - name: Reopen terminal on disposable demo account and probe genuine official IPC
        shell: bash
        timeout-minutes: 10
        env:
          MT5_DEMO_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
          MT5_DEMO_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
          MT5_DEMO_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, signal, subprocess, time
          from pathlib import Path

          prefix=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
          wine='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          winpy=r'C:\Python312\python.exe'
          terminal=r'C:\Program Files\MetaTrader 5\terminal64.exe'
          folder=prefix/'drive_c/Python312'
          env={**os.environ,'WINEPREFIX':str(prefix),'WINEDEBUG':'-all'}
          report={'test':'13','host_arch':'arm64','orders_sent':0,
                  'demo_secrets_available':False,'attempts':[],
                  'ipc_success':False,'demo_account_verified':False,
                  'terminal_process_observed':False,'journal_old_version_flag':False}

          login=os.getenv('MT5_DEMO_LOGIN','')
          pwd=os.getenv('MT5_DEMO_PASSWORD','')
          server=os.getenv('MT5_DEMO_SERVER','')
          have=bool(login and pwd and server)
          if have:
              if not login.isdecimal() or 'demo' not in server.lower() or any('\n' in x or '\r' in x for x in (login,pwd,server)):
                  raise SystemExit('Existing secrets failed disposable DEMO validation; no account will be used')
              report['demo_secrets_available']=True
              ini=folder/'test13-demo-only.ini'
              ini.write_text('[Common]\nLogin='+login+'\nPassword='+pwd+'\nServer='+server+
                             '\nKeepPrivate=0\n[Experts]\nEnabled=0\nAllowLiveTrading=0\n',encoding='utf-8')
              ini.chmod(0o600)
          else:
              print('NO_DEMO_SECRETS: will test terminal IPC without broker authentication')

          # Stop only the test runner's initial terminal, never an unrelated user session.
          ps=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True,check=True)
          stopped=0
          for row in ps.stdout.splitlines():
              try: pidstr,command=row.strip().split(None,1)
              except ValueError: continue
              cmd=command.lower()
              if ('terminal64.exe' in cmd and ('wine' in cmd or 'metatrader 5' in cmd)):
                  try: os.kill(int(pidstr),signal.SIGTERM); stopped+=1
                  except (ProcessLookupError,PermissionError): pass
          print('PREVIOUS_TERMINAL_RESTART_ATTEMPTED='+str(stopped>0).upper())
          time.sleep(7)

          args=[wine,terminal]
          if have: args.append(r'/config:C:\Python312\test13-demo-only.ini')
          subprocess.Popen(args,env=env,stdout=subprocess.DEVNULL,
                           stderr=subprocess.DEVNULL,start_new_session=True)
          time.sleep(45 if have else 35)
          processes=subprocess.run(['ps','-axo','command='],capture_output=True,text=True,check=True).stdout
          report['terminal_process_observed']=any('terminal64.exe' in s.lower() for s in processes.splitlines())
          print('TERMINAL_PROCESS_OBSERVED='+str(report['terminal_process_observed']).upper())

          script=folder/'test13-ipc-probe.py'
          script.write_text(r'''
          import json,sys
          import MetaTrader5 as mt5
          mode=sys.argv[1]
          r={'mode':mode,'mt5_package_version':mt5.__version__,
             'initialized':False,'terminal_info_present':False,
             'account_present':False,'demo_account':False,
             'quotes_available':False,'orders_sent':0}
          try:
              if mode=='automatic':
                  ok=mt5.initialize(timeout=45000)
              else:
                  ok=mt5.initialize(r'C:\Program Files\MetaTrader 5\terminal64.exe',timeout=45000)
              r['initialized']=bool(ok)
              r['last_error_code']=mt5.last_error()[0]
              if ok:
                  info=mt5.terminal_info()
                  r['terminal_info_present']=info is not None
                  r['terminal_version']=mt5.version()
                  account=mt5.account_info()
                  r['account_present']=account is not None
                  r['demo_account']=bool(account and account.trade_mode==mt5.ACCOUNT_TRADE_MODE_DEMO)
                  try:
                      r['quotes_available']=bool(mt5.symbol_info_tick('XAUUSD'))
                  except Exception:
                      pass
          except Exception as exc:
              r['exception_type']=type(exc).__name__
          finally:
              try: mt5.shutdown()
              except Exception: pass
          print('SAFE_IPC_RESULT='+json.dumps(r,separators=(',',':')),flush=True)
          ''',encoding='utf-8')

          def attempt(version,mode):
              p=subprocess.run([wine,winpy,r'C:\Python312\test13-ipc-probe.py',mode],
                               capture_output=True,text=True,timeout=85,env=env)
              row={'package_version':version,'mode':mode,'process_exit_code':p.returncode,
                   'initialized':False}
              for line in p.stdout.splitlines():
                  if line.startswith('SAFE_IPC_RESULT='):
                      row.update(json.loads(line.split('=',1)[1]))
              if not any(s.startswith('SAFE_IPC_RESULT=') for s in p.stdout.splitlines()):
                  row['no_result_line']=True
              return row

          def run_attempt(version,mode):
              try: row=attempt(version,mode)
              except subprocess.TimeoutExpired:
                  row={'package_version':version,'mode':mode,'initialized':False,'process_timeout':True}
              report['attempts'].append(row)
              print('IPC_PROBE='+json.dumps(row,separators=(',',':')),flush=True)
              if row.get('initialized') and row.get('terminal_info_present'):
                  report['ipc_success']=True
              if row.get('demo_account'):
                  report['demo_account_verified']=True

          try:
              # Test exact version pinned by the provided Mac port.
              run_attempt('5.0.6180','explicit')
              if not report['ipc_success']:
                  run_attempt('5.0.6180','automatic')

              # If pinned version fails, isolate whether the currently available newer
              # official package resolves build-dependent terminal IPC compatibility.
              if not report['ipc_success']:
                  update=subprocess.run([wine,winpy,'-m','pip','install','--no-input',
                      '--disable-pip-version-check','--only-binary=:all:',
                      'MetaTrader5==5.0.6231'],capture_output=True,text=True,timeout=120,env=env)
                  report['alternative_connector_installed']=update.returncode==0
                  if update.returncode==0:
                      run_attempt('5.0.6231','explicit')
                      if not report['ipc_success']:
                          run_attempt('5.0.6231','automatic')
          finally:
              # A short, fully redacted readiness signal. Do not publish raw terminal
              # logs, credentials, account IDs, IP addresses or broker metadata.
              logs=[]
              paths=[prefix/'drive_c/Program Files/MetaTrader 5']
              paths.extend((prefix/'drive_c/users').glob('*/AppData/Roaming/MetaQuotes/Terminal'))
              for base in paths:
                  if not base.exists(): continue
                  logs.extend(base.glob('**/logs/*.log'))
              recent=sorted((p for p in logs if p.is_file()),key=lambda p:p.stat().st_mtime,reverse=True)[:12]
              report['journal_files_detected']=len(logs)
              for logfile in recent:
                  try:
                      data=logfile.read_bytes()[-150000:]
                      t=data.decode('utf-16le' if data.count(b'\x00')>len(data)//8 else 'utf-8',errors='ignore')
                      if 'old version' in t.lower(): report['journal_old_version_flag']=True
                      found=re.findall(r'(?:MetaTrader 5|terminal)\s+(?:x64\s+)?build\s+(\d{3,7})',t,re.I)
                      if found:report['terminal_build_detected']=int(found[-1])
                  except Exception: continue
              # Always save the sanitized result for later inspection.
              Path('test13_sanitized_result.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
              for secret in (login,pwd,server):
                  # Explicitly avoid printing sensitive values.
                  assert secret not in json.dumps(report) if secret else True
              print('TEST13_IPC_CONNECTED='+str(report['ipc_success']).upper())
              print('TEST13_DEMO_VERIFIED='+str(report['demo_account_verified']).upper())
              print('TEST13_TERMINAL_OLD_VERSION='+str(report['journal_old_version_flag']).upper())
          if not report['ipc_success']:
              raise SystemExit('FAIL: official MT5 IPC never initialized. Inspect sanitized artifact; no orders placed.')
          if have and not report['demo_account_verified']:
              raise SystemExit('FAIL: MT5 IPC connected but disposable demo account was NOT verified.')
          print('PASS: official MetaTrader5 IPC initialized on Apple Silicon; no orders placed')
          PY

      - name: Upload safe diagnostic booleans and error codes even if the probe fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT5_TEST13_APPLE_SILICON_IPC_RESULTS
          path: test13_sanitized_result.json
          if-no-files-found: warn
          retention-days: 3
