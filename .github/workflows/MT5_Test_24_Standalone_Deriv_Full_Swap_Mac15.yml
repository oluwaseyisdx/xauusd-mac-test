name: MT5 Test 24 - Standalone Deriv full-swap startup diagnostics (NO TRADES)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/MT5_Test_24_Standalone_Deriv_Full_Swap_Mac15.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: mt5-test24-full-swap
  cancel-in-progress: false
jobs:
  full-swap:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      TEST_MODE: full-swap
    steps:
      - name: Check Apple Silicon and install official MetaTrader 5 for Mac
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(uname -s)" = Darwin
          if ! pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          curl -fLsS --retry 2 --connect-timeout 20 --max-time 240 \
            'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/MetaTrader5.pkg.zip' -o "$RUNNER_TEMP/mt5.zip"
          mkdir -p "$RUNNER_TEMP/mt5pkg"
          ditto -x -k "$RUNNER_TEMP/mt5.zip" "$RUNNER_TEMP/mt5pkg"
          pkg="$(find "$RUNNER_TEMP/mt5pkg" -name '*.pkg' -print -quit)"
          test -n "$pkg"
          sudo installer -pkg "$pkg" -target /
          open -a 'MetaTrader 5' || true
          sleep 20
          test -x '/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
          test -s "$HOME/Library/Application Support/net.metaquotes.wine.metatrader5/drive_c/Program Files/MetaTrader 5/terminal64.exe"
      - name: Get verified Windows Deriv MT5 files from Test 19
        uses: actions/download-artifact@v4
        with:
          name: MT5_TEST19_WINDOWS_APP_TRANSFER
          repository: oluwaseyisdx/xauusd-mac-test
          run-id: 40316484137
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/transfer
      - name: Verify archive and prepare diagnostic scripts
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/diagnostic.py" <<'PY'
          import hashlib,json,os,shutil,subprocess,time,zipfile,stat
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          prefix=Path.home()/'Library/Application Support/net.metaquotes.wine.metatrader5'
          root=prefix/'drive_c/Program Files/MetaTrader 5'
          archive=temp/'transfer/DerivMT5App.zip'
          manifest=json.loads((temp/'transfer/manifest.json').read_text(encoding='utf-8-sig'))
          def digest(path):
              with open(path,'rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          assert digest(archive)==manifest['archive_sha256'],'Archive checksum mismatch'
          assert int(manifest['build'])>=6200,'Old build'
          stage=prefix/'drive_c/Test24Staging'
          if stage.exists():shutil.rmtree(stage)
          stage.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name=info.filename.replace('\\','/')
                  parts=Path(name).parts
                  mode=(info.external_attr>>16)&0o170000
                  if not name or name.startswith('/') or '..' in parts or ':' in name or mode==stat.S_IFLNK:
                      raise RuntimeError('Unsafe archive member')
              z.extractall(stage)
          assert digest(stage/'terminal64.exe')==manifest['terminal_sha256'],'Terminal checksum mismatch'
          original=root/'terminal64.exe'
          assert original.is_file(),'Official terminal missing'
          mode=os.environ['TEST_MODE']
          assert mode in ('binary-only','full-swap')
          def inspect(tag):
              before=time.time()
              wine='/Applications/MetaTrader 5.app/Contents/SharedSupport/wine/bin/wine64'
              err=temp/('private_'+tag+'.txt')
              # Do not set or provide any broker credentials. No trading EA attached.
              env=os.environ.copy();env['WINEPREFIX']=str(prefix);env['WINEDEBUG']='+module,+loaddll,+seh'
              with err.open('wb') as handle:
                  p=subprocess.Popen([wine,r'C:\Program Files\MetaTrader 5\terminal64.exe','/portable'],
                                     env=env,stdout=subprocess.DEVNULL,stderr=handle,start_new_session=True)
              time.sleep(36)
              # Inspect only bounded boolean flags; never upload journals or stderr.
              ps=subprocess.run(['ps','-axo','pid=,command='],capture_output=True,text=True,timeout=8).stdout
              seen=any('terminal64.exe' in line.lower() for line in ps.splitlines())
              folders=[root/'logs',root/'MQL5/Logs']
              folders+=list(prefix.glob('drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/*/logs'))
              folders+=list(prefix.glob('drive_c/users/*/AppData/Roaming/MetaQuotes/Terminal/*/MQL5/Logs'))
              journals=[f for d in folders for f in d.glob('*.log') if f.is_file() and f.stat().st_mtime>=before-5]
              raw=err.read_bytes()[-250000:].decode('utf-8',errors='replace').lower()
              flags={
                'missing_module':any(w in raw for w in ('c0000135','module not found','failed to load dll','import_dll library')),
                'access_violation':any(w in raw for w in ('c0000005','page fault','access violation')),
                'wine_unhandled_exception':any(w in raw for w in ('unhandled exception','segmentation fault')),
                'stderr_nonempty':bool(raw.strip()),
              }
              jflags={'old_version':False,'initialization_error':False,'authorization_error':False}
              for f in journals[:30]:
                  try:
                      data=f.read_bytes()[-50000:]
                      for codec in ('utf-8','utf-16le'):
                          txt=data.decode(codec,errors='replace').lower()
                          jflags['old_version']|='old version' in txt
                          jflags['initialization_error']|=any(x in txt for x in ('initialization failed','failed to initialize','failed to start'))
                          jflags['authorization_error']|='authorization failed' in txt
                  except OSError:pass
              try:p.terminate();p.wait(timeout=4)
              except Exception:pass
              # Wine child may continue independently; avoid two active terminals.
              subprocess.run(['pkill','-f','terminal64.exe'],capture_output=True,timeout=4)
              time.sleep(3)
              return {'tag':tag,'launcher_exit_code':p.poll(),'process_seen':seen,
                      'new_journal_count':len(journals),'loader_flags':flags,'journal_flags':jflags}
          results={'test':24,'mode':mode,'platform':'macos-15-arm64',
                   'expected_deriv_build':int(manifest['build']),
                   'source_sha256_verified':True,'no_trades_requested':True}
          results['official_control']=inspect('official')
          backup=prefix/'drive_c/Test24OfficialBackup'
          if backup.exists():shutil.rmtree(backup)
          if mode=='binary-only':
              backup.mkdir()
              shutil.copy2(original,backup/'terminal64.exe')
              shutil.copy2(stage/'terminal64.exe',original)
          else:
              root.rename(backup)
              stage.rename(root)
          results['deriv_candidate']=inspect('deriv')
          results['differential']={
             'official_started_process':results['official_control']['process_seen'],
             'deriv_started_process':results['deriv_candidate']['process_seen'],
             'deriv_new_journals':results['deriv_candidate']['new_journal_count']>0,
             'no_broker_authentication_attempted':True,
             'bridge_not_tested':True,
          }
          Path('test24_'+mode+'.json').write_text(json.dumps(results,indent=2)+'\n')
          print('TEST24_SAFE_DIAGNOSTIC='+json.dumps(results,sort_keys=True),flush=True)
          PY
      - name: Compare official Mac MT5 against Deriv candidate without trading
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/diagnostic.py"
      - name: Upload sanitized results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MT5_TEST24_full-swap_DIAGNOSTICS
          path: test24_full-swap.json
          if-no-files-found: warn
          retention-days: 3
